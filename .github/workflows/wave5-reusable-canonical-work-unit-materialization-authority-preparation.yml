name: wave5-reusable-canonical-work-unit-materialization-authority-preparation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reusable-canonical-work-unit-materialization-authority-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run WU-103 preparation tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_reusable_canonical_work_unit_materialization_authority_preparation_wu103.py' -v

      - name: Assert exact preparation anchors
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/scripts/plan_governed_work_unit_materialization.py)" = "c561b34dbf3fb7cfefd1a2a9780aba6e857ec78c"
          test "$(git hash-object .pncc-dev/contracts/governed-work-unit-materialization-policy.json)" = "8b6b6d9116b96a8f4746c22906a522589a9ae6e0"
          test "$(git hash-object .pncc-dev/scripts/select_provider_work_unit.py)" = "8045a97d5344f058064690cb265b30f88973e2b8"
          test "$(git hash-object docs/governance/PROVIDER_TRUTH_WORK_UNIT_SELECTION.md)" = "c6b5c9e394415febd586273d3e64ef01c8628cf8"
          test "$(git hash-object .pncc-dev/schemas/work-unit.schema.json)" = "a6b23c5695262192175216e6293d832f8e835851"
          test "$(git hash-object .pncc-dev/contracts/reusable-canonical-work-unit-materialization-authority-preparation.json)" = "39066812c079bbfb9b0a4b598427f65d6ec4f9a8"

      - name: Assert exact WU-103 branch boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-103-reusable-work-unit-materialization-authority-preparation'
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "dc2caccb903cd02fab38aa61b67ae3be03f0b021"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-reusable-canonical-work-unit-materialization-authority-preparation.yml' \
            '.pncc-dev/contracts/reusable-canonical-work-unit-materialization-authority-preparation.json' \
            '.pncc-dev/tests/test_reusable_canonical_work_unit_materialization_authority_preparation_wu103.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -E '^(\.pncc-state/|src/windows-v7/|\.adwf-consumer/|tools/runtime-agent/)' /tmp/actual

      - name: Assert preparation remains default deny and workflow read only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.pncc-dev/contracts/reusable-canonical-work-unit-materialization-authority-preparation.json').read_text(encoding='utf-8'))
          assert c['preparation_state']=='WAITING_EXPLICIT_OWNER_AUTHORIZATION'
          assert c['generic_continuation_counts_as_authorization'] is False
          assert c['owner_authorization_present'] is False
          assert c['reusable_authority_granted'] is False
          assert c['reusable_issue_creation_authority'] is False
          assert c['frontier_blob_sha_at_preparation']=='3897e6db3bb9d853de7b4b04cebc82c6f0d55563'
          assert c['frontier_semantics']=='DYNAMIC_GOVERNED_INPUT_REVALIDATED_EVERY_TRANSACTION'
          assert c['frontier_blob_is_lifetime_authority_anchor'] is False
          assert c['frontier_must_be_canonical_on_fresh_current_main'] is True
          assert c['frontier_blob_sha_must_be_recorded_per_transaction'] is True
          t=Path('.github/workflows/wave5-reusable-canonical-work-unit-materialization-authority-preparation.yml').read_text(encoding='utf-8').lower()
          forbidden=[
              'contents:'+' write', 'issues:'+' write', 'pull-requests:'+' write',
              'persist-credentials:'+' true', 'git'+' push', 'gh'+' api',
              '--method'+' post', '--method'+' patch', '--method'+' put', '--method'+' delete',
              'force:'+' true'
          ]
          for token in forbidden:
              assert token not in t, token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
