name: wave6-wu207-post-remediation-installer-build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wave6-wu207-post-remediation-installer-build.yml'
      - '.pncc-dev/contracts/wave6-wu207-post-remediation-installer-build.json'

permissions:
  contents: read

jobs:
  validate-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact WU207 PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact authorized base and bounded zero-product diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test '${{ github.event.pull_request.base.sha }}' = '8a424860c72586339cd578e1c26d2cb23ba84c82'
          git fetch --no-tags --depth=1 origin '8a424860c72586339cd578e1c26d2cb23ba84c82'
          mapfile -t actual < <(git diff --name-only '8a424860c72586339cd578e1c26d2cb23ba84c82...HEAD' | sort)
          expected=(
            '.github/workflows/wave6-wu207-post-remediation-installer-build.yml'
            '.pncc-dev/contracts/wave6-wu207-post-remediation-installer-build.json'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          test "$(printf '%s\n' "${actual[@]}")" = "$(printf '%s\n' "${expected[@]}")"
          if printf '%s\n' "${actual[@]}" | grep -Eq '^(installer/|src/|legacy/|tools/runtime-agent/|tools/release/|\.pncc-state/)'; then
            echo 'FORBIDDEN_PRODUCT_RUNTIME_OR_PROVIDER_STATE_MUTATION' >&2
            exit 1
          fi
          test "$(git rev-parse '8a424860c72586339cd578e1c26d2cb23ba84c82:installer/windows/VPS-Control-PNCC.iss')" = 'b744a7446e86b34b4be1df01349e7c033da81644'
          test -z "$(git status --porcelain)"

  build-one-installer:
    needs: validate-authority
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact authorized main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8a424860c72586339cd578e1c26d2cb23ba84c82
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source and canonical installer identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne '8a424860c72586339cd578e1c26d2cb23ba84c82') { throw 'EXACT_MAIN_SOURCE_MISMATCH' }
          if ((git hash-object 'installer/windows/VPS-Control-PNCC.iss').Trim() -ne 'b744a7446e86b34b4be1df01349e7c033da81644') { throw 'CANONICAL_INSTALLER_BLOB_MISMATCH' }
          if (git status --porcelain) { throw 'DIRTY_EXACT_MAIN_CHECKOUT' }
      - name: Acquire and verify pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          if ($actual -ne $expected) { throw "PINNED_COMPILER_SHA256_MISMATCH actual=$actual" }
          "WU207_COMPILER_SHA256=$actual" | Add-Content -Path $env:GITHUB_ENV
          "WU207_COMPILER_INSTALLER=$installer" | Add-Content -Path $env:GITHUB_ENV
      - name: Install pinned compiler ephemerally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath $env:WU207_COMPILER_INSTALLER -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "INNO_SETUP_INSTALL_FAILED exit=$($p.ExitCode)" }
          $candidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 7\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          if ($candidates.Count -ne 1) { throw "PINNED_ISCC_DISCOVERY_FAILED count=$($candidates.Count)" }
          "WU207_ISCC=$($candidates[0])" | Add-Content -Path $env:GITHUB_ENV
      - name: Build exactly one canonical installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:WU207_ISCC 'installer/windows/VPS-Control-PNCC.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC_BUILD_FAILED exit=$LASTEXITCODE" }
          $outputDir = 'installer/windows/Output'
          $files = @(Get-ChildItem -LiteralPath $outputDir -File)
          if ($files.Count -ne 1) { throw "INSTALLER_OUTPUT_COUNT_MISMATCH count=$($files.Count)" }
          $exe = $files[0]
          if ($exe.Name -ne 'VPS-Control-PNCC-v7.0.2-setup.exe') { throw "INSTALLER_FILENAME_MISMATCH actual=$($exe.Name)" }
          $sha = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          $expected = 'b3d9a6d7e6562933d405333be51de94ccd009cabeaf6ab6877a0616b61d3b8a6'
          if ($sha -ne $expected) { throw "REPRODUCIBILITY_SHA256_MISMATCH actual=$sha expected=$expected" }
          "WU207_EXE_PATH=$($exe.FullName)" | Add-Content -Path $env:GITHUB_ENV
          "WU207_EXE_SHA256=$sha" | Add-Content -Path $env:GITHUB_ENV
          "WU207_EXE_SIZE=$($exe.Length)" | Add-Content -Path $env:GITHUB_ENV
      - name: Record SHA-256 provenance
        shell: pwsh
        run: |
          @"
          ## PIPE-WU-207 installer provenance
          - source exact main: `8a424860c72586339cd578e1c26d2cb23ba84c82`
          - installer definition blob: `b744a7446e86b34b4be1df01349e7c033da81644`
          - Inno Setup: `7.1.0`
          - compiler installer SHA-256: `$env:WU207_COMPILER_SHA256`
          - output: `VPS-Control-PNCC-v7.0.2-setup.exe`
          - output SHA-256: `$env:WU207_EXE_SHA256`
          - output bytes: `$env:WU207_EXE_SIZE`
          - purpose: manual Windows 10 validation only
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - name: Upload the single short-retention installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VPS-Control-PNCC-v7.0.2-setup.exe
          path: ${{ env.WU207_EXE_PATH }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
