name: wave5-reusable-autonomous-merge-close-owner-authorization

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reusable-merge-close-owner-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run exact WU-100 Owner Authorization tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_reusable_autonomous_merge_close_owner_authorization_wu100.py' -v
      - name: Assert exact authorization anchors
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/reusable-autonomous-merge-close-authority-preparation.json)" = "d4cfd9d740e8323bc8686f32b46db2bbfaa53f20"
          test "$(git hash-object .pncc-dev/contracts/autonomous-merge-issue-close-eligibility-policy.json)" = "8999f027e47e2b6da04f30a12ae9414cb3b7d05c"
          test "$(git hash-object .pncc-dev/attestations/reusable-autonomous-merge-close-owner-authorization-wu100.json)" = "1440aef6a7fffaee06149ef13b86bd17172ecc3e"
          test "$(git hash-object .pncc-dev/contracts/reusable-autonomous-merge-close-authorized.json)" = "baa503d63eaa437545ddcf0a045cf864d1ef36e6"
      - name: Assert exact authorization branch and bounded diff
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-100-reusable-merge-close-owner-authorization'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-reusable-autonomous-merge-close-authority-preparation.yml' \
            '.github/workflows/wave5-reusable-autonomous-merge-close-owner-authorization.yml' \
            '.pncc-dev/attestations/reusable-autonomous-merge-close-owner-authorization-wu100.json' \
            '.pncc-dev/contracts/reusable-autonomous-merge-close-authorized.json' \
            '.pncc-dev/tests/test_reusable_autonomous_merge_close_owner_authorization_wu100.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Assert authorization workflow itself is read only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-reusable-autonomous-merge-close-owner-authorization.yml').read_text(encoding='utf-8').lower()
          forbidden=[
              'contents:'+' write','issues:'+' write','pull-requests:'+' write',
              'git'+' push','gh'+' pr merge','gh'+' issue close',
              '--method'+' post','--method'+' patch','--method'+' put','--method'+' delete'
          ]
          for token in forbidden:
              assert token not in t, token
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
