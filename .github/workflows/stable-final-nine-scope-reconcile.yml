name: stable-final-nine-scope-reconcile
on:
  pull_request:
    paths:
      - 'tools/runtime-agent/Test-PnccStableFinalNineScopeReconcile.ps1'
      - '.pncc-dev/tests/stable-final-nine-scope-reconcile-pass.fixture.json'
      - '.github/workflows/stable-final-nine-scope-reconcile.yml'
  workflow_dispatch:
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/runtime-agent/Test-PnccStableFinalNineScopeReconcile.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_};exit 1}
      - name: Assert authority boundary markers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw=Get-Content 'tools/runtime-agent/Test-PnccStableFinalNineScopeReconcile.ps1' -Raw
          foreach($m in @('PNCC_STABLE_FINAL_NINE_SCOPE_RECONCILE_V1','rc_runtime_truth_used','runtime_authority_candidate','promotion_eligible','release_or_tag_authorized')){if(-not$raw.Contains($m)){throw "missing $m"}}
          if($raw -match 'PNCC-RQ-RC14\.39|WU028|WU029|WU030'){throw 'legacy RC authority marker forbidden'}
          if($raw -match '(?i)Stop-Process|Start-Process|RestartTunnel|taskkill'){throw 'mutation primitive forbidden'}
      - name: Fixture PASS
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'pncc-stable-final-reconcile'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/runtime-agent/Test-PnccStableFinalNineScopeReconcile.ps1' -Mode Fixture -InputPath '.pncc-dev/tests/stable-final-nine-scope-reconcile-pass.fixture.json' -OutputDirectory $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $r=Get-Content (Join-Path $out 'stable-final-nine-scope-reconcile-result.json') -Raw|ConvertFrom-Json
          if($r.state -ne 'STABLE_NINE_SCOPE_RECONCILE_PASS' -or -not $r.all_nine_scopes_pass -or -not $r.runtime_authority_candidate -or $r.runtime_authority -or $r.promotion_eligible -or $r.release_or_tag_authorized){throw 'final reconcile contract semantics invalid'}
          if(@($r.checks).Count -ne 9){throw 'expected exactly nine scopes'}
