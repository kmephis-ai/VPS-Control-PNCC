name: wave5-durable-autonomous-continuation-multi-session-steady-state-execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  durable-autonomous-continuation-multi-session-steady-state-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and replay WU-118 multi-session execution
        run: python3 .pncc-dev/scripts/validate_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py

      - name: Run WU-118 adversarial tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py' -v

      - name: Assert exact immutable WU-118 artifacts and anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-multi-session-steady-state-execution-wu118.json)" = "33c887d92e4f7e2fde384f5946a3240142a6bd4a"
          test "$(git hash-object .pncc-dev/scripts/validate_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py)" = "01f55600cefeac21fbcc13e676141caa60fd9da1"
          test "$(git hash-object .pncc-dev/tests/test_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py)" = "1446add3386b08c70f86763a30891128849ac5e6"
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-session-checkpoint-wu118.json)" = "b458e310ce54a86e9be0ecc7e1fda4e9530d6e92"
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-multi-session-handoff-record-wu118.json)" = "19fa9c3d93f007651574be484b1fb2963164efcd"
          test "$(git hash-object .pncc-dev/contracts/governed-frontier-transition-pipe-wu-118.json)" = "7eb9f77c8803a22acf5e4e27ff19f1189d4db343"
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-multi-session-steady-state-policy.json)" = "1c1107d0d8ef446b0e07848b2fbf1dd30dea07bd"
          test "$(git hash-object .pncc-dev/scripts/evaluate_durable_autonomous_continuation_multi_session_steady_state.py)" = "58b8d1e73a7436be754b75d111c9695bccd3e888"
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-multi-session-handoff-record-wu117.json)" = "bb1e1ef834184a4dddfdcdb239d7bd2dc75d187d"
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-control-loop-policy.json)" = "822bcd1833ff4843b6bd176337b3ef3b742275de"
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-execution-admission-policy.json)" = "406d78da6250c452bfc7706b57dc51a18ca48977"
          test "$(git hash-object .pncc-dev/contracts/reusable-writer-lease-bounded-branch-authorized.json)" = "717e1f9081915f40fad2e0620c64245a650ca235"

      - name: Assert WU-118 provider-state acquisition ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin pncc-provider-state
          git cat-file -e 50e9bd45794265eb1cce3eef9c549b002a8436a8^{commit}
          git cat-file -e ba7b057162ebd80aeccdbea1600306929b9d9941^{commit}
          test "$(git rev-parse ba7b057162ebd80aeccdbea1600306929b9d9941^)" = "50e9bd45794265eb1cce3eef9c549b002a8436a8"
          git show 50e9bd45794265eb1cce3eef9c549b002a8436a8:.pncc-state/writer-lease-registry.json > /tmp/wu118-before.json
          git show ba7b057162ebd80aeccdbea1600306929b9d9941:.pncc-state/writer-lease-registry.json > /tmp/wu118-after.json
          test "$(git hash-object /tmp/wu118-before.json)" = "b527f84d3c4ee9c5450e2c04b73695e22f10e074"
          test "$(git hash-object /tmp/wu118-after.json)" = "a0faf93cd35ffb422003d599677cfe4ea375e77e"
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/wu118-before.json'))
          after=json.load(open('/tmp/wu118-after.json'))
          assert before['generation']==25
          assert after['generation']==26
          old=[e for e in before['entries'] if e['lease_id']=='4d1d6f58-0376-4ad5-88f6-5c9d16aceb71']
          assert len(old)==1 and old[0]['work_unit_id']=='PIPE-WU-117' and old[0]['state']=='RELEASED'
          assert not [e for e in before['entries'] if e['lease_id']=='e5fdaab4-192f-4c88-a4dc-8590f0d4c7f6']
          new=[e for e in after['entries'] if e['lease_id']=='e5fdaab4-192f-4c88-a4dc-8590f0d4c7f6']
          assert len(new)==1
          e=new[0]
          assert e['work_unit_id']=='PIPE-WU-118'
          assert e['state']=='ACTIVE'
          assert e['generation']==26
          assert e['base_sha']=='395ed526d845ea7bb084467fe20237b3c5edf92e'
          assert e['branch']=='agent/PIPE-WU-118-durable-autonomous-continuation-multi-session-steady-state-execution'
          PY

      - name: Assert exact bounded WU-118 diff and branch ancestry
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-118-durable-autonomous-continuation-multi-session-steady-state-execution'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "395ed526d845ea7bb084467fe20237b3c5edf92e"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          FIRST_COMMIT="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | head -n 1)"
          test -n "$FIRST_COMMIT"
          test "$(git rev-parse "$FIRST_COMMIT^")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-durable-autonomous-continuation-multi-session-steady-state-execution.yml' \
            '.github/workflows/wave5-durable-autonomous-continuation-multi-session-steady-state.yml' \
            '.pncc-dev/contracts/durable-autonomous-continuation-multi-session-handoff-record-wu118.json' \
            '.pncc-dev/contracts/durable-autonomous-continuation-multi-session-steady-state-execution-wu118.json' \
            '.pncc-dev/contracts/durable-autonomous-continuation-session-checkpoint-wu118.json' \
            '.pncc-dev/contracts/governed-frontier-transition-pipe-wu-118.json' \
            '.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json' \
            '.pncc-dev/scripts/validate_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py' \
            '.pncc-dev/tests/test_durable_autonomous_continuation_multi_session_steady_state_execution_wu118.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -E '^(\.pncc-state/|src/windows-v7/|\.adwf-consumer/|tools/runtime-agent/)' /tmp/actual

      - name: Assert WU-118 consumed successor frontier on original PR only
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-118-durable-autonomous-continuation-multi-session-steady-state-execution'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json)" = "9eb493c22a2b11f01345f26d95d306e49882f78b"
          python3 - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path('.pncc-dev/contracts/durable-autonomous-continuation-multi-session-steady-state-execution-wu118.json').read_text())
          h=json.loads(Path('.pncc-dev/contracts/durable-autonomous-continuation-multi-session-handoff-record-wu118.json').read_text())
          f=json.loads(Path('.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json').read_text())
          t=json.loads(Path('.pncc-dev/contracts/governed-frontier-transition-pipe-wu-118.json').read_text())
          assert e['independent_session_count']==2
          assert e['session_sequence_monotonic'] is True
          assert e['session_ids_distinct'] is True
          assert e['checkpoint_ids_distinct'] is True
          assert e['provider_drift_between_sessions_detected'] is True
          assert e['stale_prior_session_authority_reuse_performed'] is False
          assert e['batch_provider_mutation_performed'] is False
          assert e['all_delegated_transactions_followed_by_fresh_readback'] is True
          assert h['session_sequence']==2
          assert h['checkpoint_id']=='PNCC-CONTINUATION-CHECKPOINT-WU118-CLEAN-A2'
          assert h['previous_checkpoint_id']=='PNCC-CONTINUATION-CHECKPOINT-WU117-CLEAN-A1'
          assert h['handoff_class']=='CLEAN_ITERATION_BOUNDARY'
          assert h['provider_readback_completed'] is True
          assert f['frontier_id']=='AUTONOMOUS_CONTINUATION_HUMAN_BY_EXCEPTION_READINESS_ASSESSMENT'
          assert f['runtime_required'] is False
          assert f['next_natural_boundary']=='AUTONOMOUS_CONTINUATION_HUMAN_BY_EXCEPTION_READINESS_DECISION'
          assert t['predecessor_frontier']['blob_sha']=='8d200456847139a9490df81c2797940b614eabbd'
          assert t['successor_frontier']['blob_sha']=='9eb493c22a2b11f01345f26d95d306e49882f78b'
          PY

      - name: Assert workflow itself is read only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-durable-autonomous-continuation-multi-session-steady-state-execution.yml').read_text().lower()
          forbidden=['contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write','git'+' push','gh'+' pr merge','gh'+' issue close','--method'+' post','--method'+' patch','--method'+' put','--method'+' delete']
          for token in forbidden: assert token not in t,token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
