name: wave5-writer-lease-bounded-branch-execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bounded-execution-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run exact bounded execution tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_writer_lease_bounded_branch_execution_wu098.py' -v
      - name: Assert exact PR head and bounded diff
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          test "${{ github.head_ref }}" = "agent/PIPE-WU-098-bounded-execution"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-writer-lease-bounded-branch-execution.yml' \
            '.pncc-dev/attestations/writer-lease-bounded-branch-execution-wu098.json' \
            '.pncc-dev/tests/test_writer_lease_bounded_branch_execution_wu098.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Assert workflow itself is read only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-writer-lease-bounded-branch-execution.yml').read_text(encoding='utf-8').lower()
          forbidden=['contents:'+' write','issues:'+' write','pull-requests:'+' write','git'+' push','gh'+' pr merge','--method'+' post','--method'+' patch','--method'+' put','--method'+' delete']
          for x in forbidden:
              assert x not in t,x
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
