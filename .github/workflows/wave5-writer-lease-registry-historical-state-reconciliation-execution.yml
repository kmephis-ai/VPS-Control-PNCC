name: wave5-writer-lease-registry-historical-state-reconciliation-execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  writer-lease-registry-historical-state-reconciliation-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch immutable provider transaction commits
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin pncc-provider-state
          git cat-file -e 7b48a4701f04b72537f96e60401ed404ef226ea8^{commit}
          git cat-file -e c825b7b6b6a84fa2bbf2360b0768eae878c7845a^{commit}
          test "$(git rev-parse c825b7b6b6a84fa2bbf2360b0768eae878c7845a^)" = "7b48a4701f04b72537f96e60401ed404ef226ea8"
          git show 7b48a4701f04b72537f96e60401ed404ef226ea8:.pncc-state/writer-lease-registry.json > /tmp/wu123-pre.json
          git show c825b7b6b6a84fa2bbf2360b0768eae878c7845a:.pncc-state/writer-lease-registry.json > /tmp/wu123-post.json
          test "$(git hash-object /tmp/wu123-pre.json)" = "2e6ecf0d3c03c4da8bab6bc47ea84ffdc66838ad"
          test "$(git hash-object /tmp/wu123-post.json)" = "f5b9b45092e46fe3dd2539fcff0187426059233c"
          git diff-tree --no-commit-id --name-only -r 7b48a4701f04b72537f96e60401ed404ef226ea8 c825b7b6b6a84fa2bbf2360b0768eae878c7845a > /tmp/provider-files
          test "$(wc -l < /tmp/provider-files)" -eq 1
          grep -Fx '.pncc-state/writer-lease-registry.json' /tmp/provider-files

      - name: Assert exact four-field provider reconciliation semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          before=json.load(open('/tmp/wu123-pre.json'))
          after=json.load(open('/tmp/wu123-post.json'))
          ids={
            '3bf7a003-1e8e-4ab2-910d-0c1d4aba9b03',
            'ee8b93cb-c629-4f69-82c6-25793fd10d8f',
            '38a86545-e9b7-47eb-9b6e-3c9974bbd020',
            '9c2dcb40-26dc-4dce-aa4f-c1be79a66983',
          }
          assert before['generation']==after['generation']==31
          assert len(before['entries'])==len(after['entries'])
          changed=[]
          for b,a in zip(before['entries'],after['entries']):
              assert b['lease_id']==a['lease_id']
              if b['lease_id'] in ids:
                  assert b['state']=='ACTIVE'
                  assert a['state']=='RELEASED'
                  bb=dict(b); aa=dict(a); bb.pop('state'); aa.pop('state')
                  assert bb==aa
                  changed.append(b['lease_id'])
              else:
                  assert b==a
          assert set(changed)==ids and len(changed)==4
          current=[x for x in after['entries'] if x['lease_id']=='184af451-beeb-4447-b729-07799c89e56b']
          assert len(current)==1
          assert current[0]['work_unit_id']=='PIPE-WU-123'
          assert current[0]['generation']==31
          assert current[0]['state']=='ACTIVE'
          assert current[0]['base_sha']=='61a32add50f2db41fe462f5c84276f86fe2abbbc'
          assert current[0]['branch']=='agent/PIPE-WU-123-writer-lease-registry-historical-state-reconciliation-execution'
          PY

      - name: Assert exact WU-123 evidence anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/writer-lease-registry-historical-state-reconciliation-execution-wu123.json)" = "b1c3914417ee3d7f12731b6937c11275fe418af8"
          test "$(git hash-object .pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json)" = "915ccdd52d1a4d742917cd0d1a6f20174af3a34d"
          test "$(git hash-object .pncc-dev/contracts/governed-frontier-transition-pipe-wu-123.json)" = "ed39db00afe8e20267c834576a32422786bb0267"
          test "$(git hash-object .pncc-dev/tests/test_writer_lease_registry_historical_state_reconciliation_execution_wu123.py)" = "652a4413830b5f97e8837f9dda3848a497e061f5"
          test "$(git hash-object .pncc-dev/contracts/writer-lease-registry-historical-state-reconciliation-authorized.json)" = "20fc664e90b1390351a5de70c98563140ef3190d"
          test "$(git hash-object .pncc-dev/attestations/writer-lease-registry-historical-state-reconciliation-owner-authorization-wu122.json)" = "f1207b8b78081f107bf1f449066554b6693c922f"
          test "$(git hash-object .pncc-dev/contracts/writer-lease-registry-historical-state-reconciliation-authority-preparation-wu121.json)" = "e0104e181a814960e30b1734e82770affbbf923c"
          test "$(git hash-object .pncc-dev/tests/test_writer_lease_registry_historical_state_reconciliation_owner_authorization_wu122.py)" = "0a455b5f1f67645cdff722fd2607b56b722f7816"
          test "$(git hash-object .github/workflows/wave5-writer-lease-registry-historical-state-reconciliation-owner-authorization.yml)" = "c064c34e4f1f72c44af2bc52fa28c8b08517af66"

      - name: Run WU-123 adversarial execution tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_writer_lease_registry_historical_state_reconciliation_execution_wu123.py' -v

      - name: Evaluate governed frontier lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git show 61a32add50f2db41fe462f5c84276f86fe2abbbc:.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json > /tmp/wu123-predecessor-frontier.json
          test "$(git hash-object /tmp/wu123-predecessor-frontier.json)" = "546ad9e256a838ab7c1ab32abbe037d999ea4b69"
          python3 .pncc-dev/scripts/evaluate_governed_frontier_lifecycle.py \
            --transition .pncc-dev/contracts/governed-frontier-transition-pipe-wu-123.json \
            --predecessor /tmp/wu123-predecessor-frontier.json \
            --successor .pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json \
            --work-unit-id PIPE-WU-123 \
            --base-sha 61a32add50f2db41fe462f5c84276f86fe2abbbc \
            --branch agent/PIPE-WU-123-writer-lease-registry-historical-state-reconciliation-execution

      - name: Assert exact bounded WU-123 diff and ancestry
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-123-writer-lease-registry-historical-state-reconciliation-execution'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "61a32add50f2db41fe462f5c84276f86fe2abbbc"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          FIRST_COMMIT="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | head -n 1)"
          test -n "$FIRST_COMMIT"
          test "$(git rev-parse "$FIRST_COMMIT^")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-writer-lease-registry-historical-state-reconciliation-execution.yml' \
            '.github/workflows/wave5-writer-lease-registry-historical-state-reconciliation-owner-authorization.yml' \
            '.pncc-dev/contracts/governed-frontier-transition-pipe-wu-123.json' \
            '.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json' \
            '.pncc-dev/contracts/writer-lease-registry-historical-state-reconciliation-execution-wu123.json' \
            '.pncc-dev/tests/test_writer_lease_registry_historical_state_reconciliation_execution_wu123.py' \
            '.pncc-dev/tests/test_writer_lease_registry_historical_state_reconciliation_owner_authorization_wu122.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -E '^(\.pncc-state/|src/windows-v7/|\.adwf-consumer/|tools/runtime-agent/)' /tmp/actual

      - name: Assert evidence grants no higher authority
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          e=json.load(open('.pncc-dev/contracts/writer-lease-registry-historical-state-reconciliation-execution-wu123.json'))
          f=json.load(open('.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json'))
          t=json.load(open('.pncc-dev/contracts/governed-frontier-transition-pipe-wu-123.json'))
          assert e['higher_autonomy_granted'] is False
          assert f['higher_autonomy_authority'] is False
          assert f['provider_mutation_authority'] is False
          assert f['writer_lease_mutation_authority'] is False
          assert t['provider_mutation_authority'] is False
          assert t['merge_authority'] is False
          assert t['runtime_action_authority'] is False
          assert t['higher_autonomy_granted'] is False
          PY

      - name: Assert workflow itself is read only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-writer-lease-registry-historical-state-reconciliation-execution.yml').read_text().lower()
          forbidden=['contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write','git'+' push','gh'+' pr merge','--method'+' post','--method'+' patch','--method'+' put','--method'+' delete']
          for token in forbidden: assert token not in t,token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
