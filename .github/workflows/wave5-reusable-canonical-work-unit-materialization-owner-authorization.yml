name: wave5-reusable-canonical-work-unit-materialization-owner-authorization

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reusable-canonical-work-unit-materialization-owner-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run exact WU-103 reusable materialization Owner Authorization tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_reusable_canonical_work_unit_materialization_owner_authorization_wu103.py' -v
      - name: Assert exact reusable materialization authorization anchors
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/reusable-canonical-work-unit-materialization-authority-preparation.json)" = "39066812c079bbfb9b0a4b598427f65d6ec4f9a8"
          test "$(git hash-object .pncc-dev/attestations/reusable-canonical-work-unit-materialization-owner-authorization-wu103.json)" = "77097901769fbed927a6cf4a5f8e0172c97527d3"
          test "$(git hash-object .pncc-dev/contracts/reusable-canonical-work-unit-materialization-authorized.json)" = "39db0554b86932b1beb4bb7250d040c06f9371ea"
          test "$(git hash-object .pncc-dev/scripts/plan_governed_work_unit_materialization.py)" = "c561b34dbf3fb7cfefd1a2a9780aba6e857ec78c"
          test "$(git hash-object .pncc-dev/contracts/governed-work-unit-materialization-policy.json)" = "8b6b6d9116b96a8f4746c22906a522589a9ae6e0"
          test "$(git hash-object .pncc-dev/scripts/select_provider_work_unit.py)" = "8045a97d5344f058064690cb265b30f88973e2b8"
          test "$(git hash-object docs/governance/PROVIDER_TRUTH_WORK_UNIT_SELECTION.md)" = "c6b5c9e394415febd586273d3e64ef01c8628cf8"
          test "$(git hash-object .pncc-dev/schemas/work-unit.schema.json)" = "a6b23c5695262192175216e6293d832f8e835851"
      - name: Assert exact authorization branch and bounded diff
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-103-reusable-materialization-owner-authorization'
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "a337c0c775df959fdb55d86dcace71204f508dae"
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-reusable-canonical-work-unit-materialization-owner-authorization.yml' \
            '.pncc-dev/attestations/reusable-canonical-work-unit-materialization-owner-authorization-wu103.json' \
            '.pncc-dev/contracts/reusable-canonical-work-unit-materialization-authorized.json' \
            '.pncc-dev/tests/test_reusable_canonical_work_unit_materialization_owner_authorization_wu103.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Assert workflow itself is read only and frontier remains dynamic
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.pncc-dev/attestations/reusable-canonical-work-unit-materialization-owner-authorization-wu103.json').read_text(encoding='utf-8'))
          g=json.loads(Path('.pncc-dev/contracts/reusable-canonical-work-unit-materialization-authorized.json').read_text(encoding='utf-8'))
          assert r['frontier_blob_sha_at_authorization']=='3897e6db3bb9d853de7b4b04cebc82c6f0d55563'
          assert r['frontier_is_dynamic_governed_input'] is True
          assert r['frontier_blob_is_lifetime_authority_anchor'] is False
          assert g['frontier_semantics']=='DYNAMIC_GOVERNED_INPUT_REVALIDATED_EVERY_TRANSACTION'
          assert g['frontier_blob_is_lifetime_authority_anchor'] is False
          t=Path('.github/workflows/wave5-reusable-canonical-work-unit-materialization-owner-authorization.yml').read_text(encoding='utf-8').lower()
          forbidden=[
              'contents:'+' write','issues:'+' write','pull-requests:'+' write',
              'git'+' push','gh'+' pr merge','gh'+' issue close',
              '--method'+' post','--method'+' patch','--method'+' put','--method'+' delete',
              'update-ref'+' -f','force:'+' true'
          ]
          for token in forbidden:
              assert token not in t, token
          PY
      - name: Assert authorization workflow does not itself mutate provider or product
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-reusable-canonical-work-unit-materialization-owner-authorization.yml').read_text(encoding='utf-8').lower()
          forbidden=[
              'pncc-'+'provider-state',
              '127.0.0.1:'+'1080',
              '127.0.0.1:'+'1081',
              'product/'+'runtime',
              'release'+' create',
              'git'+' tag'
          ]
          for token in forbidden:
              assert token not in t, token
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
