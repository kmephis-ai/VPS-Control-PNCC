name: stable-primary-1081-live-controlled-restart

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-primary-1081-live-controlled-restart:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: PowerShell 5.1 parse preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/runtime-agent/Invoke-PnccStablePrimary1081ControlledRestart.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){throw ($errors|Out-String)}

      - name: Assert live executor safety and failure-evidence markers
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw=Get-Content 'tools/runtime-agent/Invoke-PnccStablePrimary1081ControlledRestart.ps1' -Raw
          foreach($required in @(
            'PNCC_OWNER_ONE_SHOT_PRIMARY_1081_RESTART_V1',
            'CONTROLLED_RESTART_PRIMARY_1081',
            'PNCC_STABLE_PRIMARY_1081_MUTATION_AUTHORIZATION_V1',
            'PNCC_STABLE_PRIMARY_1081_LIVE_CONTROLLED_RESTART_V1',
            'DEFAULT_DENY: valid OwnerAuthorizationPath required for Live mutation',
            'owner token exact main SHA mismatch',
            'owner token exact target identity/fingerprint mismatch',
            'owner token expired or validity window exceeds 10 minutes',
            'owner token already consumed',
            '$RouteProbeMaxAttempts=3',
            'SOCKS identity probe failed after attempts=',
            'last_exit_code=',
            '$preRoute=SocksIdentity',
            '-Action RestartTunnel -NoAppLaunch',
            'RedirectStandardOutput $restartStdout',
            'RedirectStandardError $restartStderr',
            'RESTART_TUNNEL_FAILED_RUNTIME_HEALTHY',
            'RESTART_TUNNEL_FAILED_RUNTIME_UNHEALTHY',
            'RESTART_TUNNEL_TIMEOUT',
            'automatic_mutation_retry=$false',
            'restart-tunnel.stdout.log',
            'restart-tunnel.stderr.log',
            'CRITICAL 1080 snapshot changed',
            'post-restart routed identity changed',
            'RUNTIME_AUTHORITY=false PROMOTION_ELIGIBLE=false'
          )){if($raw -notlike ('*'+$required+'*')){throw "missing safety marker: $required"}}
          if($raw.IndexOf('$preRoute=SocksIdentity') -gt $raw.IndexOf("Move-Item -LiteralPath `$OwnerAuthorizationPath")){throw 'route probe must remain before token consumption'}
          if($raw.IndexOf('Move-Item -LiteralPath $OwnerAuthorizationPath') -gt $raw.IndexOf('Start-Process $PsExe')){throw 'token must be consumed before RestartTunnel invocation'}
          if(($raw | Select-String -Pattern 'Start-Process \\$PsExe' -AllMatches).Matches.Count -ne 1){throw 'exactly one RestartTunnel process invocation allowed'}
          if($raw -match '(?i)Stop-Process'){throw 'broad Stop-Process forbidden'}
          if($raw -match '(?i)taskkill'){throw 'taskkill forbidden'}
          if($raw -match '(?i)\\$arguments\\s*\\+=\\s*@\\(\\s*["'']-pw["'']'){throw 'plaintext -pw construction forbidden'}

      - name: Execute admitted fixture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\runtime-agent\Invoke-PnccStablePrimary1081ControlledRestart.ps1 -Mode Fixture -FixturePath .\.pncc-dev\fixtures\stable-primary-1081-live-controlled-restart-admitted.json -OutputDirectory $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw "fixture failed rc=$LASTEXITCODE"}
          $r=Get-Content (Join-Path $env:RUNNER_TEMP 'stable-primary-1081-live-restart-result.json') -Raw|ConvertFrom-Json
          if($r.state -cne 'LIVE_EXECUTOR_ADMITTED_DEFAULT_DENY'){throw "unexpected state: $($r.state)"}
          if([bool]$r.physical_execution_allowed -or [bool]$r.owner_authorization_consumed -or [bool]$r.mutation_executed -or [bool]$r.runtime_mutation){throw 'fixture mutation boundary violated'}
          if(-not[bool]$r.restart_stdout_capture_required -or -not[bool]$r.restart_stderr_capture_required -or -not[bool]$r.failure_receipt_required){throw 'failure evidence contract missing'}
          if([bool]$r.automatic_mutation_retry){throw 'automatic mutation retry must remain false'}
          if([bool]$r.runtime_authority -or [bool]$r.promotion_eligible){throw 'authority boundary violated'}

      - name: Prove Live mode default-denies without owner token
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stdout=Join-Path $env:RUNNER_TEMP 'default-deny.out'
          $stderr=Join-Path $env:RUNNER_TEMP 'default-deny.err'
          $arguments="-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$env:GITHUB_WORKSPACE\tools\runtime-agent\Invoke-PnccStablePrimary1081ControlledRestart.ps1`" -Mode Live -RepositoryRoot `"$env:GITHUB_WORKSPACE`" -OutputDirectory `"$env:RUNNER_TEMP`""
          $p=Start-Process powershell.exe -ArgumentList $arguments -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $text=((Get-Content $stdout -Raw -ErrorAction SilentlyContinue)+(Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
          if($p.ExitCode -eq 0){throw 'Live mode unexpectedly succeeded without owner token'}
          if($text -notmatch 'DEFAULT_DENY: valid OwnerAuthorizationPath required for Live mutation'){throw "missing default-deny proof: $text"}
          if(Test-Path (Join-Path $env:RUNNER_TEMP 'restart-tunnel.stdout.log')){throw 'RestartTunnel stdout evidence unexpectedly created before authorization'}
          if(Test-Path (Join-Path $env:RUNNER_TEMP 'restart-tunnel.stderr.log')){throw 'RestartTunnel stderr evidence unexpectedly created before authorization'}

      - name: Prove redirected child exit code capture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $child=Join-Path $env:RUNNER_TEMP 'wu069-child-exit1.ps1'
          $stdout=Join-Path $env:RUNNER_TEMP 'wu069-child.out'
          $stderr=Join-Path $env:RUNNER_TEMP 'wu069-child.err'
          [IO.File]::WriteAllText($child,"Write-Output 'WU069_CHILD_MARKER'; exit 1",(New-Object Text.UTF8Encoding($true)))
          $args="-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$child`""
          $p=Start-Process powershell.exe -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'synthetic child timeout'}
          $p.Refresh()
          $rc=[int]$p.ExitCode
          if($rc-ne1){throw "redirected exit-code capture mismatch: expected=1 actual=$rc"}
          if((Get-Content $stdout -Raw) -notmatch 'WU069_CHILD_MARKER'){throw 'synthetic stdout capture missing'}
          Write-Host 'WU069_REDIRECTED_EXITCODE_CAPTURE=PASS EXPECTED=1 ACTUAL=1'

      - name: Prove nested false propagates through mutation-lock shape
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-Wu069Lock([scriptblock]$ScriptBlock){try{return (& $ScriptBlock)}finally{}}
          function Invoke-Wu069Apply{return $false}
          function Invoke-Wu069Restart{return Invoke-Wu069Lock {if(-not(Invoke-Wu069Apply)){return $false};return $true}}
          $value=Invoke-Wu069Restart
          if($value -is [Array]){throw 'nested false unexpectedly became array'}
          if([bool]$value){throw 'nested false unexpectedly became truthy'}
          Write-Host 'WU069_NESTED_FALSE_PROPAGATION=PASS'

      - name: Assert repository remains clean
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dirty=@(git status --porcelain)
          if($dirty.Count){throw ("repository dirty:`n"+($dirty -join "`n"))}
