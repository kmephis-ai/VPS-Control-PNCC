name: runtime-primary-1081-reconcile
on:
  pull_request:
    paths:
      - 'tools/runtime-agent/Invoke-PnccPrimary1081BaselineReconcile.ps1'
      - 'tests/fixtures/runtime-primary-1081-reconcile-plan.json'
      - '.github/workflows/runtime-primary-1081-reconcile.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $p='tools/runtime-agent/Invoke-PnccPrimary1081BaselineReconcile.ps1'
          $bytes=[IO.File]::ReadAllBytes($p)
          if($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF){throw 'UTF-8 BOM required'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 required'}
      - name: Assert lifecycle safety contract
        shell: powershell
        run: |
          $raw=Get-Content 'tools/runtime-agent/Invoke-PnccPrimary1081BaselineReconcile.ps1' -Raw
          foreach($needle in @("`$ReservePort=1080","`$PrimaryPort=1081","RESERVE_1080_MUTATION=false","plaintext -pw fallback","Ensure-V7OfficialPuttyHostKeyTrust","-pwfile","-Action RestartTunnel","-Action Watchdog")){if($raw -notlike "*$needle*"){throw "missing safety marker: $needle"}}
          if($raw -match '(?i)Stop-Process\s+.*1080'){throw 'direct reserve stop forbidden'}
          if($raw -match '(?i)-D\s+.*1080'){throw 'reserve tunnel launch forbidden'}
          if($raw -match '(?i)\$Pid\b'){throw 'reserved $PID collision forbidden'}
          if($raw -match '(?i)(?:^|\s)-pw\s+[^<]'){Write-Host 'Source contains regex/text references to -pw only; runtime construction must remain pwfile-only.'}
      - name: Execute non-mutating Plan mode under Windows PowerShell 5.1
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'pncc-plan'
          $text=& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/runtime-agent/Invoke-PnccPrimary1081BaselineReconcile.ps1' -Mode Plan -FixturePath 'tests/fixtures/runtime-primary-1081-reconcile-plan.json' -OutputDirectory $out
          if($LASTEXITCODE -ne 0){throw "plan failed rc=$LASTEXITCODE"}
          if(($text -join "`n") -notmatch 'PNCC_PRIMARY_1081_RECONCILE=PLAN_PASS RUNTIME_MUTATION=false RESERVE_1080_MUTATION=false'){throw 'plan contract marker missing'}
      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain){git status --short;throw 'workflow mutated repository'}
