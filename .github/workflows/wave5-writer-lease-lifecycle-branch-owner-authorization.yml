name: wave5-writer-lease-lifecycle-branch-owner-authorization

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  authorization-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run exact authorization tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_writer_lease_lifecycle_branch_execution_owner_authorization.py' -v
      - name: Assert authorization PR does not execute mutation authority except exact WU-105 proof-only provenance
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          python3 .pncc-dev/scripts/check_wu105_provenance_compatibility.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Assert workflow itself is read only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('.github/workflows/wave5-writer-lease-lifecycle-branch-owner-authorization.yml').read_text(encoding='utf-8').lower()
          for x in ['contents:'+' write','issues:'+' write','pull-requests:'+' write','git'+' push','gh'+' pr merge','--method'+' post','--method'+' patch','--method'+' put','--method'+' delete']:
              assert x not in t,x
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
