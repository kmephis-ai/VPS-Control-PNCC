name: quality-deep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-deep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-deep:
    name: quality-deep
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert Windows PowerShell 5.1 and pinned Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
            throw "Windows PowerShell 5.1 required; got $($PSVersionTable.PSVersion)"
          }
          Import-Module Pester -RequiredVersion 5.9.0 -Force -ErrorAction Stop
          $pesterVersion = (Get-Module Pester).Version.ToString()
          if ($pesterVersion -ne '5.9.0') { throw "Unexpected Pester version: $pesterVersion" }
          Write-Host "POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          Write-Host "PESTER_VERSION=$pesterVersion"

      - name: Verify exact sanitized fixture provenance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $modulePath = Join-Path $env:GITHUB_WORKSPACE '.pncc-dev\quality\PNCC.SanitizedFixtureProvenance.psm1'
          $contractPath = Join-Path $env:GITHUB_WORKSPACE '.pncc-dev\contracts\sanitized-fixture-provenance.json'
          Import-Module $modulePath -Force -ErrorAction Stop
          $result = Test-PnccSanitizedFixtureProvenance -RepositoryRoot $env:GITHUB_WORKSPACE -ContractPath $contractPath
          if ($result.Status -ne 'PASS') {
            @($result.Errors) | ForEach-Object { Write-Error $_ }
            throw "Sanitized fixture provenance failed: $($result.FailureClass)"
          }
          Write-Host "FIXTURE_PROVENANCE_RESULT=PASS TREE=$($result.FixtureGitTreeSha) ENTRIES=$($result.EntryCount) FILES=$($result.ActualFileCount) VERIFIED=$($result.VerifiedCount)"

      - name: Run Pester DEEP provenance regressions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.9.0 -Force -ErrorAction Stop
          $testPath = Join-Path $env:GITHUB_WORKSPACE '.pncc-dev\pester-deep'
          $result = Invoke-Pester -Path $testPath -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) {
            throw "DEEP Pester failures: $($result.FailedCount)"
          }
          if ($result.TotalCount -lt 9) {
            throw "DEEP Pester test-count floor violated: expected >=9, got $($result.TotalCount)"
          }
          Write-Host "DEEP_PESTER_RESULT=PASS TOTAL=$($result.TotalCount) PASSED=$($result.PassedCount) FAILED=$($result.FailedCount)"
