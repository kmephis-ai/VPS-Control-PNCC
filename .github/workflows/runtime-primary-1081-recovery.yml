name: runtime-primary-1081-recovery
on:
  pull_request:
    paths:
      - 'tools/runtime-agent/Invoke-PnccPrimary1081Recovery.ps1'
      - 'tests/fixtures/runtime-primary-1081-recovery-plan.json'
      - '.github/workflows/runtime-primary-1081-recovery.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $p='tools/runtime-agent/Invoke-PnccPrimary1081Recovery.ps1'
          $b=[IO.File]::ReadAllBytes($p)
          if($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF){throw 'UTF-8 BOM required'}
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)
          if($e.Count){$e|ForEach-Object{Write-Error $_.Message};exit 1}
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 required'}
      - name: Assert recovery safety contract
        shell: powershell
        run: |
          $r=Get-Content 'tools/runtime-agent/Invoke-PnccPrimary1081Recovery.ps1' -Raw
          foreach($n in @('$PrimaryPort=1081','$ReservePort=1080','RESERVE_1080_MUTATION=false','-pwfile','plaintext -pw fallback','Ensure-V7OfficialPuttyHostKeyTrust','WU026_BLOCKED_NO_1081')){if($r -notlike "*$n*"){throw "missing marker: $n"}}
          if($r -match '(?i)Stop-Process\s+.*1080'){throw 'reserve stop forbidden'}
          if($r -match '(?i)-D\s+.*1080'){throw 'reserve launch forbidden'}
          if($r -match '(?i)\$Pid\b'){throw 'reserved PID collision forbidden'}
      - name: Execute non-mutating Plan mode under Windows PowerShell 5.1
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'pncc-recovery-plan'
          $txt=& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/runtime-agent/Invoke-PnccPrimary1081Recovery.ps1' -Mode Plan -FixturePath 'tests/fixtures/runtime-primary-1081-recovery-plan.json' -OutputDirectory $out
          if($LASTEXITCODE -ne 0){throw "plan rc=$LASTEXITCODE"}
          if(($txt -join "`n") -notmatch 'PNCC_PRIMARY_1081_RECOVERY=PLAN_PASS RUNTIME_MUTATION=false RESERVE_1080_MUTATION=false'){throw 'plan marker missing'}
      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain){git status --short;throw 'workflow mutated repository'}
