name: wave6-wu149-writer-lease-cas-executor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/wave6-wu149-writer-lease-cas-executor.yml'
      - '.pncc-dev/contracts/wave6-wu149-writer-lease-cas-executor.json'
      - '.pncc-dev/scripts/writer_lease_cas_executor_wu149.py'
      - '.pncc-dev/tests/test_writer_lease_cas_executor_wu149.py'
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  validate-executor:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-149-bounded-dispatch-fallback'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run CAS executor adversarial tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_writer_lease_cas_executor_wu149.py' -v
      - name: Assert executor is engineering-control-plane only
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/wu149-diff
          ! grep -E '^(src/windows-v7/|legacy/|tools/runtime-agent/|tools/release/|\.adwf-consumer/|\.pncc-state/)' /tmp/wu149-diff
          test -z "$(git status --porcelain)"

  execute-cas-request:
    if: github.event_name == 'issues' && contains(github.event.issue.body, 'PNCC-LEASE-CAS-REQUEST')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    concurrency:
      group: pncc-writer-lease-cas
      cancel-in-progress: false
    steps:
      - name: Checkout exact default-branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Execute one dual-CAS Writer Lease transaction
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .pncc-dev/scripts/writer_lease_cas_executor_wu149.py --issue-number "${{ github.event.issue.number }}" --repository-owner "${{ github.repository_owner }}"
      - name: Prove checkout remained clean
        run: test -z "$(git status --porcelain)"
