name: wave6-wu188-installer-definition-static-validator

on:
  pull_request:
    paths:
      - '.pncc-dev/contracts/wave6-wu188-installer-definition-static-content-policy.json'
      - '.pncc-dev/scripts/wu188_installer_definition_static_validator.py'
      - '.pncc-dev/tests/test_wu188_installer_definition_static_validator.py'
      - '.github/workflows/wave6-wu188-installer-definition-static-validator.yml'

permissions:
  contents: read

jobs:
  static-validator-readiness:
    if: github.event.pull_request.head.ref == 'agent/PIPE-WU-188-installer-definition-static-content-validator-readiness'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile pure validator
        run: python3 -m py_compile .pncc-dev/scripts/wu188_installer_definition_static_validator.py
      - name: Run adversarial tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_wu188_installer_definition_static_validator.py' -v
      - name: Assert bounded four-file diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort)
          expected=(
            '.github/workflows/wave6-wu188-installer-definition-static-validator.yml'
            '.pncc-dev/contracts/wave6-wu188-installer-definition-static-content-policy.json'
            '.pncc-dev/scripts/wu188_installer_definition_static_validator.py'
            '.pncc-dev/tests/test_wu188_installer_definition_static_validator.py'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${files[*]}" == "${expected_sorted[*]}" ]]
      - name: Assert least-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '(^|/)src/|runtime-agent|\.iss$|\.exe$'
          ! grep -R -nE 'runs-on:[[:space:]]*self-hosted|contents:[[:space:]]*write|pull-requests:[[:space:]]*write|issues:[[:space:]]*write' .github/workflows/wave6-wu188-installer-definition-static-validator.yml
          ! find . \( -type f -name '*.iss' -o -type f -name '*.exe' \) -path './.pncc-dev/*' | grep .
          python3 - <<'PY'
          import json
          p=json.load(open('.pncc-dev/contracts/wave6-wu188-installer-definition-static-content-policy.json', encoding='utf-8'))
          a=p['authority']
          assert a['bind_installer_definition_identity'] is False
          assert a['persist_installer_definition'] is False
          assert a['authorize_proposal_content'] is False
          assert a['compiler_acquisition'] is False
          assert a['compiler_execution'] is False
          assert a['binary_build'] is False
          assert a['artifact_upload'] is False
          assert a['product_runtime_mutation'] is False
          assert a['release'] is False
          assert a['tag'] is False
          assert a['promotion'] is False
          assert a['stable_transition'] is False
          assert a['ruleset_or_security_weakening'] is False
          assert a['self_hosted_runner'] is False
          assert a['reserve_1080_lifecycle_mutation'] is False
          assert a['primary_1081_lifecycle_mutation'] is False
          assert a['v631_mutation'] is False
          assert a['secret_collection'] is False
          PY
      - name: Assert repository clean
        run: test -z "$(git status --porcelain)"
