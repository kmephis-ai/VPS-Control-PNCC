name: wave6-wu202-wu200-output-transport-reproducibility-guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.pncc-dev/scripts/wu200_reproducible_installer_artifact.ps1'
      - '.github/workflows/wave6-wu200-reproducible-installer-artifact.yml'
      - '.pncc-dev/tests/test_wu200_reproducible-installer-artifact.py'
      - '.github/workflows/wave6-wu201-wu200-output-handoff-remediation.yml'
      - '.pncc-dev/tests/test_wu201_wu200_output_handoff_remediation.py'
      - '.pncc-dev/contracts/wave6-wu202-wu200-output-transport-reproducibility-guard.json'
      - '.pncc-dev/tests/test_wu202_wu200_output_transport_reproducibility_guard.py'
      - '.github/workflows/wave6-wu202-wu200-output-transport-reproducibility-guard.yml'

permissions:
  contents: read

jobs:
  validate-wu202:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR head
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha }}') { throw 'EXACT_HEAD_MISMATCH' }
      - name: Parse WU200 executor under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.pncc-dev/scripts/wu200_reproducible_installer_artifact.ps1'), [ref]$tokens, [ref]$errors)
          if (@($errors).Count -ne 0) { $errors | Out-String | Write-Error; exit 1 }
      - name: Run WU200 WU201 WU202 regression tests
        shell: pwsh
        run: |
          python .pncc-dev/tests/test_wu200_reproducible_installer_artifact.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .pncc-dev/tests/test_wu201_wu200_output_handoff_remediation.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .pncc-dev/tests/test_wu202_wu200_output_transport_reproducibility_guard.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact bounded diff and least authority
        shell: pwsh
        run: |
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'
          $actual = @(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | Sort-Object)
          $expected = @(
            '.github/workflows/wave6-wu200-reproducible-installer-artifact.yml',
            '.github/workflows/wave6-wu201-wu200-output-handoff-remediation.yml',
            '.github/workflows/wave6-wu202-wu200-output-transport-reproducibility-guard.yml',
            '.pncc-dev/contracts/wave6-wu202-wu200-output-transport-reproducibility-guard.json',
            '.pncc-dev/scripts/wu200_reproducible_installer_artifact.ps1',
            '.pncc-dev/tests/test_wu200_reproducible_installer_artifact.py',
            '.pncc-dev/tests/test_wu201_wu200_output_handoff_remediation.py',
            '.pncc-dev/tests/test_wu202_wu200_output_transport_reproducibility_guard.py'
          ) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) { throw "WU202_BOUNDED_DIFF_MISMATCH`nactual=$($actual -join ',')" }
          if ($actual | Where-Object { $_ -match '^(src/|legacy/|tools/runtime-agent/|tools/release/|\.pncc-state/|installer/windows/)' }) { throw 'FORBIDDEN_PATH_MUTATION' }
          $wf = Get-Content -Raw '.github/workflows/wave6-wu202-wu200-output-transport-reproducibility-guard.yml'
          if ($wf.Contains('self' + '-hosted') -or $wf.Contains('actions/' + 'cache') -or $wf -match '(?m)^\s*contents:\s*write\s*$') { throw 'WU202_AUTHORITY_EXPANSION' }
          if ($wf -match '(?m)^\s*issues:\s*write\s*$' -or $wf -match '(?m)^\s*security-events:\s*write\s*$') { throw 'WU202_WRITE_PERMISSION_EXPANSION' }
          $uploadToken = 'actions/' + 'upload-' + 'artifact@'
          if ($wf.Contains($uploadToken)) { throw 'WU202_ARTIFACT_PUBLICATION_NOT_ALLOWED' }
          foreach ($token in @('Invoke-' + 'WebRequest','Start-' + 'Process','ISCC' + '.exe')) {
            if ($wf.Contains($token)) { throw 'WU202_BUILD_EXECUTION_NOT_ALLOWED' }
          }
          if (git status --porcelain) { throw 'DIRTY_CHECKOUT' }
