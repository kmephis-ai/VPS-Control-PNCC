name: wave5-autonomous-continuation-human-by-exception-durable-multi-session-steady-state-existing-authority-only

on:
  pull_request:
    paths:
      - '.pncc-dev/contracts/autonomous-continuation-human-by-exception-durable-multi-session-steady-state-wu132.json'
      - '.pncc-dev/scripts/validate_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py'
      - '.pncc-dev/tests/test_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py'
      - '.github/workflows/wave5-autonomous-continuation-human-by-exception-durable-multi-session-steady-state-existing-authority-only.yml'
  push:
    branches:
      - 'agent/PIPE-WU-132-human-by-exception-durable-multi-session-steady-state-existing-authority-only'
    paths:
      - '.pncc-dev/contracts/autonomous-continuation-human-by-exception-durable-multi-session-steady-state-wu132.json'
      - '.pncc-dev/scripts/validate_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py'
      - '.pncc-dev/tests/test_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py'
      - '.github/workflows/wave5-autonomous-continuation-human-by-exception-durable-multi-session-steady-state-existing-authority-only.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PIPE-WU-132 evidence
        run: python .pncc-dev/scripts/validate_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py
      - name: Run PIPE-WU-132 regression tests
        run: python -m unittest discover -s .pncc-dev/tests -p 'test_autonomous_continuation_human_by_exception_durable_multi_session_steady_state_wu132.py' -v
