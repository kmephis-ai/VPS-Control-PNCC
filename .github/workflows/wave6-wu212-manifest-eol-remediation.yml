name: wave6-wu212-manifest-eol-remediation

on:
  pull_request:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/wave6-wu212-manifest-eol-remediation.yml'
      - '.pncc-dev/contracts/wave6-wu212-manifest-eol-remediation.json'
      - '.pncc-dev/tests/test_wu212_manifest_eol_remediation.py'
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  validate-remediation:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify historical exact bounded diff when applicable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='c725ab82465a0a094fde00359c4a78fd18cd3f3c'
          if('${{ github.event.pull_request.base.sha }}' -eq $base){
            $expected=@(
              '.gitattributes',
              '.github/workflows/wave6-wu212-manifest-eol-remediation.yml',
              '.pncc-dev/contracts/wave6-wu212-manifest-eol-remediation.json',
              '.pncc-dev/tests/test_wu212_manifest_eol_remediation.py'
            ) | Sort-Object
            $actual=@(git diff --name-only "$base...HEAD" | Sort-Object)
            if(($actual -join "`n") -ne ($expected -join "`n")){throw "BOUNDED_DIFF_MISMATCH actual=$($actual -join ',')"}
            git diff --quiet $base HEAD -- src/windows-v7/VPS-Control-v7-README.txt src/windows-v7/VPS-Control-v7-launch.ps1 src/rollback-base/VPS-Control-v6.3.1.ps1
            if($LASTEXITCODE -ne 0){throw 'FORBIDDEN_PRODUCT_OR_V631_MUTATION'}
            Write-Host 'WU212_HISTORICAL_BOUNDARY=PASS'
          } else {
            Write-Host 'WU212_HISTORICAL_BOUNDARY=NOT_APPLICABLE'
          }
      - name: Run WU212 Windows materialization regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'GITHUB_HOSTED_REQUIRED'}
          python .pncc-dev/tests/test_wu212_manifest_eol_remediation.py -v

  build-validation-installer:
    if: github.event_name == 'issues' && github.event.issue.number == 474 && contains(github.event.issue.body, 'PNCC-WU212-INSTALLER-BUILD-EXECUTE')
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: pncc-wu212-one-validation-installer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Verify one-shot execution marker
        id: gate
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $ErrorActionPreference='Stop'
          $pattern='<!--\s*PNCC-WU212-INSTALLER-BUILD-EXECUTE\s+schema=1\s+expected_source=([0-9a-f]{40})\s*-->'
          $m=[Regex]::Matches($env:ISSUE_BODY,$pattern)
          if($m.Count -ne 1){throw 'EXECUTION_MARKER_INVALID'}
          if([Regex]::Matches($env:ISSUE_BODY,'PNCC-WU212-INSTALLER-BUILD-EXECUTE').Count -ne 1){throw 'EXECUTION_MARKER_AMBIGUOUS'}
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'GITHUB_HOSTED_REQUIRED'}
          $source=$m[0].Groups[1].Value
          "source=$source" | Add-Content $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.gate.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact post-merge source and remediation
        shell: pwsh
        env:
          WU212_SOURCE: ${{ steps.gate.outputs.source }}
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -ne $env:WU212_SOURCE){throw 'EXACT_SOURCE_MISMATCH'}
          if((git rev-parse 'HEAD^1').Trim() -ne 'c725ab82465a0a094fde00359c4a78fd18cd3f3c'){throw 'UNEXPECTED_POST_MERGE_PARENT'}
          $v='src/rollback-base/VPS-Control-v6.3.1.ps1'
          if((Get-Item $v).Length -ne 162507){throw 'V631_SIZE_MISMATCH'}
          if((Get-FileHash -Algorithm SHA256 $v).Hash.ToLowerInvariant() -ne '385e5178f10e79b0b234376e6a6671b64ce523a3971b2b4341ec94ce1efee11e'){throw 'V631_SHA256_MISMATCH'}
          if((git hash-object $v).Trim() -ne 'fbcf80dac2d619c421b8a40b5612cd13d5da4a73'){throw 'V631_GIT_BLOB_MISMATCH'}
          python .pncc-dev/tests/test_wu212_manifest_eol_remediation.py -v
      - name: Acquire pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          if((Get-Item $setup).Length -ne 14304168){throw 'COMPILER_SIZE_MISMATCH'}
          if((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'){throw 'COMPILER_SHA256_MISMATCH'}
          $dir=Join-Path $env:RUNNER_TEMP 'pncc-wu212-inno'
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR='+$dir)) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'COMPILER_INSTALL_FAILED'}
          "WU212_SETUP=$setup" | Add-Content $env:GITHUB_ENV
          "WU212_INNO=$dir" | Add-Content $env:GITHUB_ENV
          "WU212_ISCC=$(Join-Path $dir 'ISCC.exe')" | Add-Content $env:GITHUB_ENV
      - name: Build two ephemeral byte-identical candidates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pncc-wu212-repro'
          New-Item -ItemType Directory $root | Out-Null
          $hashes=@();$sizes=@();$paths=@()
          foreach($n in 'a','b'){
            $out=Join-Path $root $n
            New-Item -ItemType Directory $out | Out-Null
            $p=Start-Process $env:WU212_ISCC -ArgumentList @('/Q',('/O'+$out),'/FVPS-Control-PNCC-v7.0.2-setup',(Resolve-Path 'installer/windows/VPS-Control-PNCC.iss').Path) -Wait -PassThru
            if($p.ExitCode -ne 0){throw "BUILD_FAILED_$n"}
            $exe=Join-Path $out 'VPS-Control-PNCC-v7.0.2-setup.exe'
            if(-not(Test-Path $exe -PathType Leaf)){throw "OUTPUT_MISSING_$n"}
            $paths += $exe
            $hashes += (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            $sizes += (Get-Item $exe).Length
          }
          if($hashes[0] -ne $hashes[1]){throw "REPRODUCIBILITY_SHA256_MISMATCH $($hashes -join ',')"}
          if($sizes[0] -ne $sizes[1]){throw "REPRODUCIBILITY_SIZE_MISMATCH $($sizes -join ',')"}
          $final=Join-Path $env:RUNNER_TEMP 'VPS-Control-PNCC-v7.0.2-setup.exe'
          Copy-Item $paths[0] $final
          "WU212_EXE=$final" | Add-Content $env:GITHUB_ENV
          "WU212_SHA=$($hashes[0])" | Add-Content $env:GITHUB_ENV
          "WU212_SIZE=$($sizes[0])" | Add-Content $env:GITHUB_ENV
      - name: Cleanup compiler and record provenance
        shell: pwsh
        env:
          WU212_SOURCE: ${{ steps.gate.outputs.source }}
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item $env:WU212_INNO -Recurse -Force
          Remove-Item $env:WU212_SETUP -Force
          if(git status --porcelain){throw 'SOURCE_CHECKOUT_MUTATED'}
          @"
          ## PIPE-WU-212 Windows validation installer
          - post-merge source: $env:WU212_SOURCE
          - README canonical/worktree SHA-256: 530241a9ab4853f95a6a528cdac94bda615c4b505cb688e8b31d51dadcf7908a
          - V6.3.1 SHA-256: 385e5178f10e79b0b234376e6a6671b64ce523a3971b2b4341ec94ce1efee11e
          - compiler SHA-256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
          - output SHA-256: $env:WU212_SHA
          - output bytes: $env:WU212_SIZE
          - two candidates byte-identical: true
          - uploaded artifact count: 1
          - purpose: repeat Windows 10 qualification only
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload exactly one validation installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VPS-Control-PNCC-v7.0.2-setup.exe
          path: ${{ env.WU212_EXE }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
