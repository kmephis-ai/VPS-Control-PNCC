name: stable-credential-hostkey-v3

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 5.1 parse and fixture contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/runtime-agent/Test-PnccStableCredentialHostkeyV3.ps1'
          $raw=[IO.File]::ReadAllBytes($p)
          if($raw.Length -lt 3 -or $raw[0] -ne 0xEF -or $raw[1] -ne 0xBB -or $raw[2] -ne 0xBF){ throw 'UTF-8 BOM required' }
          [void][scriptblock]::Create([IO.File]::ReadAllText($p))
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $p -Mode Fixture -FixturePath '.pncc-dev/tests/stable-credential-hostkey-v3-ready.fixture.json' -OutputDirectory "$env:RUNNER_TEMP\pncc-credential-hostkey-v3"
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Read-only boundary
        shell: powershell
        run: |
          $raw=[IO.File]::ReadAllText('tools/runtime-agent/Test-PnccStableCredentialHostkeyV3.ps1')
          foreach($forbidden in @('Stop-Process','Start-Process','Remove-ItemProperty','Set-ItemProperty','reg.exe delete','-hostkey *')){
            if($raw.IndexOf($forbidden,[StringComparison]::OrdinalIgnoreCase) -ge 0){ throw "forbidden mutation/bypass primitive: $forbidden" }
          }
          foreach($required in @('PNCC_STABLE_CREDENTIAL_HOSTKEY_V3','runtime_mutation=$false','runtime_authority=$false','promotion_eligible=$false','src\windows-v7\VPS-Control-v7-tunnel-manager.ps1')){
            if($raw.IndexOf($required,[StringComparison]::OrdinalIgnoreCase) -lt 0){ throw "required V3 marker missing: $required" }
          }
      - name: Repository clean
        shell: powershell
        run: |
          if(git status --porcelain){ throw 'repository dirty after contract test' }
