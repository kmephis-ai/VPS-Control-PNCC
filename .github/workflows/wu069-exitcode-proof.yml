name: wu069-exitcode-proof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-exit-semantics:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Reproduce Start-Process redirected exit-code defect under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $child=Join-Path $env:RUNNER_TEMP 'wu069-child-exit1.ps1'
          $stdout=Join-Path $env:RUNNER_TEMP 'wu069-broken.out'
          $stderr=Join-Path $env:RUNNER_TEMP 'wu069-broken.err'
          [IO.File]::WriteAllText($child,"Write-Output 'WU069_BROKEN_MARKER'; exit 1",(New-Object Text.UTF8Encoding($true)))
          $args="-NoLogo -NoProfile -ExecutionPolicy Bypass -File `"$child`""
          $p=Start-Process powershell.exe -ArgumentList $args -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'synthetic child timeout'}
          $p.Refresh()
          $brokenRc=[int]$p.ExitCode
          if((Get-Content $stdout -Raw) -notmatch 'WU069_BROKEN_MARKER'){throw 'broken-path stdout capture missing'}
          Write-Host ("WU069_BROKEN_REDIRECT_CAPTURE OBSERVED_EXIT_CODE={0} EXPECTED_CHILD_EXIT=1" -f $brokenRc)

      - name: Prove cmd wrapper preserves child exit code with file redirection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $child=Join-Path $env:RUNNER_TEMP 'wu069-wrapper-child.ps1'
          $wrapper=Join-Path $env:RUNNER_TEMP 'wu069-wrapper.cmd'
          $stdout=Join-Path $env:RUNNER_TEMP 'wu069-wrapper.out'
          $stderr=Join-Path $env:RUNNER_TEMP 'wu069-wrapper.err'
          [IO.File]::WriteAllText($child,"Write-Output 'WU069_WRAPPER_MARKER'; exit 1",(New-Object Text.UTF8Encoding($true)))
          $cmdLines=@(
            '@echo off',
            ('powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "{0}" 1>"{1}" 2>"{2}"' -f $child,$stdout,$stderr),
            'exit /b %ERRORLEVEL%'
          )
          [IO.File]::WriteAllLines($wrapper,$cmdLines,[Text.Encoding]::ASCII)
          $p=Start-Process $env:ComSpec -ArgumentList ('/d /c "'+$wrapper+'"') -PassThru -WindowStyle Hidden
          if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'wrapper child timeout'}
          $p.Refresh()
          $rc=[int]$p.ExitCode
          if($rc-ne1){throw "cmd wrapper exit mismatch: expected=1 actual=$rc"}
          if((Get-Content $stdout -Raw) -notmatch 'WU069_WRAPPER_MARKER'){throw 'wrapper stdout capture missing'}
          Write-Host 'WU069_CMD_WRAPPER_EXITCODE=PASS EXPECTED=1 ACTUAL=1'

      - name: Prove nested false propagates through mutation-lock shape
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          function Invoke-Wu069Lock([scriptblock]$ScriptBlock){try{return (& $ScriptBlock)}finally{}}
          function Invoke-Wu069Apply{return $false}
          function Invoke-Wu069Restart{return Invoke-Wu069Lock {if(-not(Invoke-Wu069Apply)){return $false};return $true}}
          $value=Invoke-Wu069Restart
          if($value -is [Array]){throw 'nested false unexpectedly became array'}
          if([bool]$value){throw 'nested false unexpectedly became truthy'}
          Write-Host 'WU069_NESTED_FALSE_PROPAGATION=PASS'

      - name: Prove top-level false becomes process exit 1 through cmd wrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $child=Join-Path $env:RUNNER_TEMP 'wu069-nested-exit1.ps1'
          $wrapper=Join-Path $env:RUNNER_TEMP 'wu069-nested-wrapper.cmd'
          $stdout=Join-Path $env:RUNNER_TEMP 'wu069-nested.out'
          $stderr=Join-Path $env:RUNNER_TEMP 'wu069-nested.err'
          $script=@'
          function Invoke-Wu069Lock([scriptblock]$ScriptBlock){try{return (& $ScriptBlock)}finally{}}
          function Invoke-Wu069Apply{return $false}
          function Restart-Tunnel{return Invoke-Wu069Lock {if(-not(Invoke-Wu069Apply)){return $false};return $true}}
          Write-Output 'WU069_NESTED_MARKER'
          if(-not(Restart-Tunnel)){exit 1}
          '@
          [IO.File]::WriteAllText($child,$script,(New-Object Text.UTF8Encoding($true)))
          $cmdLines=@(
            '@echo off',
            ('powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "{0}" 1>"{1}" 2>"{2}"' -f $child,$stdout,$stderr),
            'exit /b %ERRORLEVEL%'
          )
          [IO.File]::WriteAllLines($wrapper,$cmdLines,[Text.Encoding]::ASCII)
          $p=Start-Process $env:ComSpec -ArgumentList ('/d /c "'+$wrapper+'"') -PassThru -WindowStyle Hidden
          if(-not$p.WaitForExit(20000)){try{$p.Kill()}catch{};throw 'nested wrapper timeout'}
          $p.Refresh()
          $rc=[int]$p.ExitCode
          if($rc-ne1){throw "nested top-level exit mismatch: expected=1 actual=$rc"}
          Write-Host 'WU069_TOP_LEVEL_FALSE_EXIT=PASS EXPECTED=1 ACTUAL=1'
