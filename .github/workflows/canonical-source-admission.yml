name: canonical-source-admission

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-source-admission:
    name: canonical-source-admission
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify canonical Git-blob provenance and package manifest
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess,re
          prov_path=Path('.pncc-dev/provenance/canonical-source-post-rc14.38.json')
          if not prov_path.is_file(): raise SystemExit('canonical provenance missing')
          prov=json.loads(prov_path.read_text(encoding='utf-8'))
          if prov.get('source_root')!='src/windows-v7': raise SystemExit('unexpected source_root')
          inv=prov.get('inventory',[])
          if len(inv)!=32: raise SystemExit(f'expected 32 provenance entries, got {len(inv)}')
          def blob(path): return subprocess.check_output(['git','show',f'HEAD:{path}'])
          for rec in inv:
              rel=rec['path']; b=blob('src/windows-v7/'+rel)
              if len(b)!=rec['bytes'] or hashlib.sha256(b).hexdigest()!=rec['sha256']:
                  raise SystemExit('provenance Git-blob mismatch: '+rel)
          manifest=blob('src/windows-v7/VPS-Control-v7-SHA256.txt').decode('utf-8-sig').splitlines()
          rows=[x for x in manifest if x and not x.startswith('#')]
          if len(rows)!=31: raise SystemExit(f'expected 31 package manifest entries, got {len(rows)}')
          for row in rows:
              m=re.match(r'^([0-9a-f]{64})  (.+)$',row)
              if not m: raise SystemExit('malformed manifest row')
              rel=m.group(2).replace('\\','/')
              b=blob('src/windows-v7/'+rel)
              if hashlib.sha256(b).hexdigest()!=m.group(1): raise SystemExit('package manifest mismatch: '+rel)
          base=prov.get('baseline',{})
          if base.get('embedded_version')!='7.0.0-rc14.38' or not base.get('requires_version_bump_before_build') or base.get('next_candidate_minimum_version')!='7.0.0-rc14.39':
              raise SystemExit('version/build boundary provenance invalid')
          safety=prov.get('safety',{})
          if any(safety.get(k) for k in ('build_authority','runtime_authority','promotion_authority','stable_done')):
              raise SystemExit('provenance grants forbidden authority')
          print('CANONICAL_GIT_BLOB_PROVENANCE=PASS FILES=32 MANIFEST=31 BUILD_AUTHORITY=false')

      - name: Verify Windows PowerShell 5.1 AST, BOM and credential transport
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1){throw "Windows PowerShell 5.1 required; got $($PSVersionTable.PSVersion)"}
          $root=Join-Path $env:GITHUB_WORKSPACE 'src\windows-v7'
          $files=@(Get-ChildItem -LiteralPath $root -Filter '*.ps1' -File -Recurse)
          if($files.Count -ne 23){throw "Expected 23 PS1 files, got $($files.Count)"}
          $errors=New-Object Collections.ArrayList
          foreach($file in $files){
            $tokens=$null;$parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$parseErrors)
            foreach($e in @($parseErrors)){[void]$errors.Add("AST $($file.FullName):$($e.Extent.StartLineNumber): $($e.Message)")}
            $bytes=[IO.File]::ReadAllBytes($file.FullName)
            $bom=$bytes.Length -ge 3 -and $bytes[0]-eq 0xEF -and $bytes[1]-eq 0xBB -and $bytes[2]-eq 0xBF
            if(-not $bom){[void]$errors.Add("UTF8_BOM_REQUIRED: $($file.FullName)")}
          }
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_};throw "Canonical PS5.1 gate failed: $($errors.Count)"}
          python .pncc-dev/scripts/check_putty_password_transport.py --repository-root .
          if($LASTEXITCODE -ne 0){throw "Credential transport scanner failed rc=$LASTEXITCODE"}
          Write-Host "CANONICAL_PS51=PASS AST=23 BOM=23 EXECUTABLE_PLAINTEXT_PW=0"

      - name: Verify fixed tunnel and credential boundaries are unchanged
        shell: python
        run: |
          from pathlib import Path
          import json
          root=Path('src/windows-v7')
          c=json.loads((root/'VPS-Control-v7-TUNNEL-CONTRACT.json').read_text(encoding='utf-8-sig'))
          by={x['Id']:x for x in c['Tunnels']}
          p=by['PRIMARY_AUTO']; r=by['RESERVE_MANUAL']
          assert p['Port']==1081 and p['LifecycleMode']=='AUTO' and p['AutoStart'] and p['AutoRecovery']
          assert r['Port']==1080 and r['LifecycleMode']=='MANUAL_ONLY' and not r['AutoStart'] and not r['AutoRecovery'] and not r['AutoStop']
          assert c['CredentialTransport']['PuttyArgument']=='-pwfile' and not c['CredentialTransport']['PlaintextPwArgumentAllowed']
          assert not c['ManagedPuttyHostKeyTrust']['HostKeyVerificationDisableAllowed']
          print('CANONICAL_FIXED_BOUNDARIES=PASS PRIMARY=1081 RESERVE=1080 PWFILE=true')
