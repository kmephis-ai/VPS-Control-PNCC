name: stable-release-tag-promotion

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  release-promotion-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate historical v7.0.0 promoted Stable declaration
        run: python3 .pncc-dev/scripts/evaluate_stable_release_tag_promotion.py

      - name: Validate v7.0.1 default-deny release promotion boundary
        run: python3 .pncc-dev/scripts/evaluate_stable_release_tag_promotion_v701.py

      - name: Assert historical promotion and v7.0.1 waiting state remain isolated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          old=json.load(open('.pncc-dev/attestations/stable-release-tag-promotion-v7.0.0.json',encoding='utf-8'))
          assert old['stable_version']=='7.0.0'
          assert old['promotion_state']=='PROMOTED'
          assert old['runtime_authority'] is True
          assert old['promotion_eligible'] is True
          assert old['release_or_tag_authorized'] is True
          assert old['tag_created'] is True
          assert old['release_created'] is True
          assert old['release_asset_verified'] is True
          assert old['stable_declared'] is True
          assert old['artifact_rebuilt'] is False
          assert old['artifact_substituted'] is False
          assert old['runtime_mutation'] is False
          assert old['product_bytes_mutated'] is False
          assert old['runtime_bytes_mutated'] is False
          assert old['overwrite_existing_tag_forbidden'] is True
          assert old['overwrite_existing_release_forbidden'] is True

          new=json.load(open('.pncc-dev/attestations/stable-release-tag-promotion-v7.0.1.json',encoding='utf-8'))
          assert new['stable_version']=='7.0.1'
          assert new['runtime_authority'] is True
          assert new['target_tag']=='v7.0.1'
          assert new['target_release_name']=='VPS Control PNCC v7.0.1'
          assert new['owner_release_authorization_present'] is False
          assert new['owner_release_authorization_binding_complete'] is False
          assert new['promotion_state']=='WAITING_OWNER_RELEASE_AUTHORIZATION'
          assert new['promotion_eligible'] is False
          assert new['release_or_tag_authorized'] is False
          assert new['tag_created'] is False
          assert new['release_created'] is False
          assert new['release_asset_verified'] is False
          assert new['stable_declared'] is False
          assert new['target_tag_commit'] is None
          assert new['artifact_rebuilt'] is False
          assert new['artifact_substituted'] is False
          assert new['runtime_mutation'] is False
          assert new['product_bytes_mutated'] is False
          assert new['runtime_bytes_mutated'] is False
          assert new['private_runtime_payload_published'] is False
          assert new['overwrite_existing_tag_forbidden'] is True
          assert new['overwrite_existing_release_forbidden'] is True
          assert new['next_transaction']=='EXPLICIT_OWNER_RELEASE_AUTHORIZATION_BOUND_TO_PREPARATION_MERGE_REQUIRED'

          s=Path('.github/workflows/stable-release-tag-promotion.yml').read_text(encoding='utf-8')
          assert sum(1 for line in s.splitlines() if line.strip() == 'contents: read') == 1
          forbidden=(
              'contents:'+' write',
              'releases:'+' write',
              'git'+' push',
              'git'+' tag',
              'gh'+' release',
          )
          for token in forbidden:
              assert token.lower() not in s.lower(), token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
