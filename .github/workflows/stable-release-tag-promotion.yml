name: stable-release-tag-promotion
on:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  release-promotion-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate historical v7.0.0 promoted Stable declaration
        run: python3 .pncc-dev/scripts/evaluate_stable_release_tag_promotion.py
      - name: Validate finalized v7.0.1 Stable declaration
        run: python3 .pncc-dev/scripts/evaluate_stable_release_tag_promotion_v701.py
      - name: Run v7.0.1 promotion regressions
        run: python3 .pncc-dev/tests/test_v701_release_tag_promotion_boundary.py
      - name: Verify exact prepared default-deny blob remains in history
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'f20891555e6db3a0b5bb57488bac5e8ccf36eb71^{blob}'
          git cat-file blob f20891555e6db3a0b5bb57488bac5e8ccf36eb71 > "$RUNNER_TEMP/prepared.json"
          python3 - <<'PY'
          import json,os
          d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'prepared.json'),encoding='utf-8'))
          assert d['promotion_state']=='WAITING_OWNER_RELEASE_AUTHORIZATION'
          assert d['promotion_eligible'] is False
          assert d['release_or_tag_authorized'] is False
          assert d['tag_created'] is False and d['release_created'] is False and d['stable_declared'] is False
          PY
      - name: Assert workflows remain read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/stable-release-tag-promotion.yml').read_text(encoding='utf-8')
          assert 'contents: read' in s
          for t in ('contents:'+' write','releases:'+' write','git'+' push','git'+' tag','gh'+' release'):
            assert t.lower() not in s.lower(),t
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain --untracked-files=all)"
