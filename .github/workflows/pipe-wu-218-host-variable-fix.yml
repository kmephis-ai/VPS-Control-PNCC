name: pipe-wu-218-host-variable-fix
on:
  push:
    branches:
      - pipe-wu-218-putty-saved-session-discovery
permissions:
  contents: write
jobs:
  fix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Repair WU218 automatic-variable collision
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/windows-v7/VPS-Control-v7-engine-upgrade.ps1')
          s=p.read_text(encoding='utf-8-sig')
          old="""function Test-V7SavedSessionEndpointInfo($Info) {
              if(-not $Info){return $false}
              $host=[string]$Info.HostName
              $protocol=[string]$Info.Protocol
              $port=0
              try{$port=[int]$Info.PortNumber}catch{}
              return [bool]($host -and $protocol -and $protocol -ieq 'ssh' -and $port -ge 1 -and $port -le 65535)
          }"""
          new="""function Test-V7SavedSessionEndpointInfo($Info) {
              if(-not $Info){return $false}
              $remoteHost=[string]$Info.HostName
              $protocol=[string]$Info.Protocol
              $port=0
              try{$port=[int]$Info.PortNumber}catch{}
              return [bool]($remoteHost -and $protocol -and $protocol -ieq 'ssh' -and $port -ge 1 -and $port -le 65535)
          }"""
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8-sig',newline='\n')
          elif '$remoteHost=[string]$Info.HostName' not in s:
              raise SystemExit('WU218 endpoint validator anchor mismatch')
      - name: Validate and commit
        shell: powershell
        run: |
          $p='src/windows-v7/VPS-Control-v7-engine-upgrade.ps1'
          $t=$null;$e=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$t,[ref]$e)
          if($e.Count){$e|ForEach-Object{Write-Error $_.Message};exit 1}
          $r=Get-Content $p -Raw
          if($r -match '(?m)^\s*\$host\s*='){throw 'automatic Host variable collision remains'}
          if(-not(git status --porcelain)){Write-Host 'No generator change required';exit 0}
          $changed=@(git diff --name-only)
          foreach($f in $changed){if($f -ne 'src/windows-v7/VPS-Control-v7-engine-upgrade.ps1'){throw "unexpected mutation: $f"}}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'src/windows-v7/VPS-Control-v7-engine-upgrade.ps1'
          git commit -m 'PIPE-WU-218: avoid PowerShell Host automatic-variable collision'
          git push origin HEAD:pipe-wu-218-putty-saved-session-discovery