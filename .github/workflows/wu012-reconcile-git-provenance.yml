name: wu012-reconcile-git-provenance

on:
  push:
    branches:
      - agent/PIPE-WU-012-canonical-source-admission-a1

permissions:
  contents: write

concurrency:
  group: wu012-reconcile-git-provenance
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ !contains(github.event.head_commit.message, '[wu012-provenance-reconciled]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reconcile manifest and provenance to canonical Git blob bytes
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          src=Path('src/windows-v7')
          prov_path=Path('.pncc-dev/provenance/canonical-source-post-rc14.38.json')
          prov=json.loads(prov_path.read_text(encoding='utf-8'))
          manifest=src/'VPS-Control-v7-SHA256.txt'
          source_paths=sorted(x['path'] for x in prov['inventory'] if x['path']!='VPS-Control-v7-SHA256.txt')
          if len(source_paths)!=31: raise SystemExit(f'expected 31 non-manifest source paths, got {len(source_paths)}')
          def head_blob(rel): return subprocess.check_output(['git','show',f'HEAD:src/windows-v7/{rel}'])
          inventory=[]
          lines=['# VPS Control Center v7.0.0-rc14.38 canonical Git-blob credential-remediation source manifest']
          for rel in source_paths:
              b=head_blob(rel); h=hashlib.sha256(b).hexdigest()
              lines.append(f"{h}  {rel.replace('/', chr(92))}")
              inventory.append({'path':rel,'bytes':len(b),'sha256':h})
          manifest.write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          mb=manifest.read_bytes()
          inventory.append({'path':'VPS-Control-v7-SHA256.txt','bytes':len(mb),'sha256':hashlib.sha256(mb).hexdigest()})
          inventory=sorted(inventory,key=lambda x:x['path'])
          by={x['path']:x for x in inventory}
          prov['inventory']=inventory
          prov['hash_semantics']='CANONICAL_GIT_BLOB_BYTES'
          prov['baseline']['remediated_file_sha256']={
              'VPS-Control-v7-vps-manager.ps1':by['VPS-Control-v7-vps-manager.ps1']['sha256'],
              'VPS-Control-v7-keenetic.ps1':by['VPS-Control-v7-keenetic.ps1']['sha256']
          }
          prov_path.write_text(json.dumps(prov,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8',newline='\n')
          print('PROVENANCE_RECONCILIATION_GENERATED=PASS FILES=32 HASH_SEMANTICS=CANONICAL_GIT_BLOB_BYTES')

      - name: Verify staged Git object semantics and commit metadata only
        shell: bash
        run: |
          set -euo pipefail
          git add src/windows-v7/VPS-Control-v7-SHA256.txt .pncc-dev/provenance/canonical-source-post-rc14.38.json
          changed="$(git diff --cached --name-only)"
          test "$(echo "$changed" | wc -l)" -eq 2
          echo "$changed" | grep -Fx 'src/windows-v7/VPS-Control-v7-SHA256.txt'
          echo "$changed" | grep -Fx '.pncc-dev/provenance/canonical-source-post-rc14.38.json'
          python - <<'PY'
          import hashlib,json,re,subprocess
          prov=json.loads(open('.pncc-dev/provenance/canonical-source-post-rc14.38.json',encoding='utf-8').read())
          inv={x['path']:x for x in prov['inventory']}
          if prov.get('hash_semantics')!='CANONICAL_GIT_BLOB_BYTES' or len(inv)!=32:
              raise SystemExit('provenance semantics invalid')
          def obj(spec): return subprocess.check_output(['git','show',spec])
          for rel,rec in inv.items():
              spec=':src/windows-v7/VPS-Control-v7-SHA256.txt' if rel=='VPS-Control-v7-SHA256.txt' else f'HEAD:src/windows-v7/{rel}'
              b=obj(spec)
              if len(b)!=rec['bytes'] or hashlib.sha256(b).hexdigest()!=rec['sha256']:
                  raise SystemExit('staged provenance mismatch: '+rel)
          manifest=obj(':src/windows-v7/VPS-Control-v7-SHA256.txt').decode('utf-8-sig').splitlines()
          rows=[x for x in manifest if x and not x.startswith('#')]
          if len(rows)!=31: raise SystemExit('manifest row count invalid')
          for row in rows:
              m=re.match(r'^([0-9a-f]{64})  (.+)$',row)
              if not m: raise SystemExit('malformed manifest row')
              rel=m.group(2).replace('\\','/')
              if hashlib.sha256(obj(f'HEAD:src/windows-v7/{rel}')).hexdigest()!=m.group(1):
                  raise SystemExit('manifest Git-blob mismatch: '+rel)
          print('STAGED_CANONICAL_GIT_BLOB_PROVENANCE=PASS FILES=32 MANIFEST=31')
          PY
          git diff --cached --check
          git config user.name 'PNCC GitHub Provenance'
          git config user.email 'pncc-provenance@users.noreply.github.com'
          git commit -m 'PIPE-WU-012: reconcile canonical Git-blob provenance [wu012-provenance-reconciled]'
          git push origin HEAD:agent/PIPE-WU-012-canonical-source-admission-a1
