name: runtime-putty-085-trace-fix
on:
  pull_request:
    paths:
      - 'tools/runtime-agent/Invoke-PnccPutty085TracePrereqFix.ps1'
      - 'tests/fixtures/runtime-putty-085-trace.txt'
      - '.github/workflows/runtime-putty-085-trace-fix.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $p='tools/runtime-agent/Invoke-PnccPutty085TracePrereqFix.ps1'
          $bytes=[IO.File]::ReadAllBytes($p)
          if($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF){throw 'UTF-8 BOM required'}
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          if($PSVersionTable.PSVersion.Major -ne 5){throw 'Windows PowerShell 5.1 required'}
      - name: Assert literal trace matcher contract
        shell: powershell
        run: |
          $raw=Get-Content 'tools/runtime-agent/Invoke-PnccPutty085TracePrereqFix.ps1' -Raw
          if($raw -notmatch '\.Contains\(\$needle\)'){throw 'literal Contains matcher missing'}
          foreach($needle in @('CREDENTIAL','HOSTKEY_TRUST','PUTTY_START','pwfile-unsupported','RESERVE_1080_MUTATION=false')){if($raw -notlike "*$needle*"){throw "missing contract marker: $needle"}}
      - name: Execute exact trace regression in Plan mode
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'pncc-wu030-plan'
          $text=& powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File 'tools/runtime-agent/Invoke-PnccPutty085TracePrereqFix.ps1' -Mode Plan -FixturePath 'tests/fixtures/runtime-putty-085-trace.txt' -OutputDirectory $out
          if($LASTEXITCODE -ne 0){throw "plan failed rc=$LASTEXITCODE"}
          if(($text -join "`n") -notmatch 'PNCC_PUTTY_085_TRACE_FIX=PLAN_PASS RUNTIME_MUTATION=false RESERVE_1080_MUTATION=false'){throw 'plan PASS marker missing'}
      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain){git status --short;throw 'workflow mutated repository'}
