name: adwf-binding

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adwf-binding:
    name: adwf-binding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PNCC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pncc
          persist-credentials: false

      - name: Checkout exact ADWF Core revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kmephis-ai/AI-Development-Framework
          ref: 2e3b284d975ce0fe5707c8b24175f0ef184db780
          path: adwf-core
          persist-credentials: false

      - name: Verify exact checkout identities
        shell: bash
        run: |
          set -euo pipefail
          expected_consumer="${{ github.event.pull_request.head.sha || github.sha }}"
          actual_consumer="$(git -C pncc rev-parse HEAD)"
          actual_framework="$(git -C adwf-core rev-parse HEAD)"
          actual_pack_blob="$(git -C adwf-core rev-parse HEAD:.adwf/packs/powershell.json)"
          actual_schema_blob="$(git -C adwf-core rev-parse HEAD:.adwf/schemas/external-consumer-binding.schema.json)"
          test "$actual_consumer" = "$expected_consumer"
          test "$actual_framework" = "2e3b284d975ce0fe5707c8b24175f0ef184db780"
          test "$actual_pack_blob" = "b4ad2f2459079039a59c3e687ea269d2c6ca73fe"
          test "$actual_schema_blob" = "c3762053920076ea1ac9ba1865cbfacb6fdcf0c0"
          test ! -e pncc/.adwf
          echo "PNCC_SHA=$actual_consumer"
          echo "ADWF_SHA=$actual_framework"
          echo "POWERSHELL_PACK_BLOB=$actual_pack_blob"
          echo "EXTERNAL_BINDING_SCHEMA_BLOB=$actual_schema_blob"

      - name: Validate external thin consumer binding
        shell: bash
        run: |
          set -euo pipefail
          python3 adwf-core/.adwf/scripts/validate_external_consumer_binding.py --consumer-root "$GITHUB_WORKSPACE/pncc" --framework-root "$GITHUB_WORKSPACE/adwf-core"
