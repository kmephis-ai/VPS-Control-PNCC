name: wave6-wu203-inno-reproducibility-static-root-cause

on:
  pull_request:
    branches: [main]
    paths:
      - '.pncc-dev/contracts/wave6-wu203-inno-reproducibility-static-root-cause.json'
      - '.pncc-dev/tests/test_wu203_inno_reproducibility_static_root_cause.py'
      - '.github/workflows/wave6-wu203-inno-reproducibility-static-root-cause.yml'

permissions:
  contents: read

jobs:
  validate-wu203:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact PR head
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne '${{ github.event.pull_request.head.sha }}') { throw 'EXACT_HEAD_MISMATCH' }
      - name: Run WU203 static root-cause regression tests
        shell: pwsh
        run: |
          python .pncc-dev/tests/test_wu203_inno_reproducibility_static_root_cause.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact bounded diff and least authority
        shell: pwsh
        run: |
          git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}'
          $actual = @(git diff --name-only '${{ github.event.pull_request.base.sha }}...HEAD' | Sort-Object)
          $expected = @(
            '.github/workflows/wave6-wu203-inno-reproducibility-static-root-cause.yml',
            '.pncc-dev/contracts/wave6-wu203-inno-reproducibility-static-root-cause.json',
            '.pncc-dev/tests/test_wu203_inno_reproducibility_static_root_cause.py'
          ) | Sort-Object
          if (($actual -join "`n") -ne ($expected -join "`n")) { throw "WU203_BOUNDED_DIFF_MISMATCH`nactual=$($actual -join ',')" }
          if ($actual | Where-Object { $_ -match '^(src/|legacy/|tools/runtime-agent/|tools/release/|\.pncc-state/|installer/windows/)' }) { throw 'FORBIDDEN_PATH_MUTATION' }
          $wf = Get-Content -Raw '.github/workflows/wave6-wu203-inno-reproducibility-static-root-cause.yml'
          foreach ($token in @('self' + '-hosted','actions/' + 'upload-' + 'artifact@','actions/' + 'cache@','Invoke-' + 'WebRequest','Start-' + 'Process','ISCC' + '.exe')) {
            if ($wf.Contains($token)) { throw 'WU203_AUTHORITY_EXPANSION' }
          }
          if ($wf -match '(?m)^\s*(contents|issues|pull-requests|security-events):\s*write\s*$') { throw 'WU203_WRITE_PERMISSION_EXPANSION' }
          if (git status --porcelain) { throw 'DIRTY_CHECKOUT' }
