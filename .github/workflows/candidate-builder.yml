name: candidate-builder

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: candidate-builder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-builder-reproducibility:
    name: candidate-builder-reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Compile deterministic builder contracts without filesystem side effects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          paths = (
              'build/build_candidate.py',
              'build/verify_candidate_reproducibility.py',
              '.pncc-dev/scripts/collect_engineering_checks.py',
              '.pncc-dev/scripts/generate_candidate_manifest.py',
              '.pncc-dev/scripts/generate_runtime_qualification_request.py',
              '.pncc-dev/scripts/validate_governed_candidate_manifest.py',
              '.pncc-dev/tests/test_governed_candidate_manifest.py',
              '.pncc-dev/tests/test_runtime_qualification_request_generation.py',
          )
          for raw in paths:
              path = Path(raw)
              compile(path.read_text(encoding='utf-8-sig'), str(path), 'exec')
              print(f'PY_COMPILE=PASS PATH={path}')
          PY
          test -z "$(git status --porcelain --untracked-files=all)"
          echo 'REPOSITORY_CLEAN_AFTER_COMPILE=PASS'

      - name: Prove exact build inputs are READY
        shell: bash
        run: |
          set -euo pipefail
          python .pncc-dev/scripts/evaluate_candidate_build_input.py --repository-root . --require-ready

      - name: Build candidate independently twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/pncc-build-a" "${RUNNER_TEMP}/pncc-build-b" "${RUNNER_TEMP}/pncc-repro"
          test -z "$(git status --porcelain --untracked-files=all)"
          python build/build_candidate.py --repository-root . --output-dir "${RUNNER_TEMP}/pncc-build-a"
          python build/build_candidate.py --repository-root . --output-dir "${RUNNER_TEMP}/pncc-build-b"
          python build/verify_candidate_reproducibility.py \
            --first-dir "${RUNNER_TEMP}/pncc-build-a" \
            --second-dir "${RUNNER_TEMP}/pncc-build-b" \
            --output "${RUNNER_TEMP}/pncc-repro/build-evidence.json"

      - name: Assert build evidence carries version-bound artifact identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence=json.loads((Path(os.environ['RUNNER_TEMP'])/'pncc-repro'/'build-evidence.json').read_text(encoding='utf-8'))
          version=evidence['candidate_version']
          filename=evidence['artifact']['filename']
          assert filename == f'VPS-Control-v{version}.zip'
          assert evidence['reproducibility']['byte_identical'] is True
          print(f'CANDIDATE_IDENTITY_PLAN=PASS VERSION={version} ARTIFACT={filename}')
          PY

      - name: Run governed candidate manifest regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .pncc-dev/tests -p 'test_*candidate_manifest.py' -v

      - name: Run Stable runtime request regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .pncc-dev/tests -p 'test_runtime_qualification_request_generation.py' -v

      - name: Assert PR build grants no runtime authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'pncc-repro'/'build-evidence.json'
          e=json.loads(p.read_text(encoding='utf-8'))
          assert e['reproducibility']['byte_identical'] is True
          assert e['reproducibility']['independent_builds']==2
          assert e['runtime_authority'] is False
          assert e['promotion_authority'] is False
          print('PR_CANDIDATE_BUILD=PASS REPRODUCIBLE=true RUNTIME_AUTHORITY=false PROMOTION_AUTHORITY=false ARTIFACT_PUBLISHED=false')
          PY

  candidate-builder-main:
    name: candidate-builder-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [candidate-builder-reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout protected main exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Assert protected main build boundary
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${GITHUB_EVENT_NAME}" = "push"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          python .pncc-dev/scripts/evaluate_candidate_build_input.py --repository-root . --require-ready

      - name: Build protected-main candidate independently twice
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/pncc-main-a" "${RUNNER_TEMP}/pncc-main-b" "${RUNNER_TEMP}/pncc-main-final" "${RUNNER_TEMP}/pncc-bundle" "${RUNNER_TEMP}/pncc-runtime-request"
          python build/build_candidate.py --repository-root . --output-dir "${RUNNER_TEMP}/pncc-main-a"
          python build/build_candidate.py --repository-root . --output-dir "${RUNNER_TEMP}/pncc-main-b"
          mkdir -p "${RUNNER_TEMP}/pncc-main-final"
          python build/verify_candidate_reproducibility.py \
            --first-dir "${RUNNER_TEMP}/pncc-main-a" \
            --second-dir "${RUNNER_TEMP}/pncc-main-b" \
            --output "${RUNNER_TEMP}/pncc-main-final/build-evidence.json"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          evidence=json.loads((root/'pncc-main-final'/'build-evidence.json').read_text(encoding='utf-8'))
          version=evidence['candidate_version']
          filename=evidence['artifact']['filename']
          expected=f'VPS-Control-v{version}.zip'
          if filename != expected:
              raise SystemExit(f'artifact identity mismatch: {filename} != {expected}')
          source=root/'pncc-main-a'/filename
          if not source.is_file():
              raise SystemExit(f'built artifact missing: {source}')
          shutil.copy2(source, root/'pncc-main-final'/filename)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'PNCC_CANDIDATE_VERSION={version}\n')
              fh.write(f'PNCC_ARTIFACT_FILENAME={filename}\n')
          print(f'PROTECTED_MAIN_ARTIFACT_IDENTITY=PASS VERSION={version} ARTIFACT={filename}')
          PY

      - name: Collect exact-SHA engineering checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python .pncc-dev/scripts/collect_engineering_checks.py \
            --repository "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/pncc-main-final/engineering-checks.json" \
            --timeout-seconds 900 \
            --poll-seconds 5

      - name: Generate and validate Candidate Artifact Truth
        shell: bash
        run: |
          set -euo pipefail
          python .pncc-dev/scripts/generate_candidate_manifest.py \
            --artifact "${RUNNER_TEMP}/pncc-main-final/${PNCC_ARTIFACT_FILENAME}" \
            --build-evidence "${RUNNER_TEMP}/pncc-main-final/build-evidence.json" \
            --engineering-checks "${RUNNER_TEMP}/pncc-main-final/engineering-checks.json" \
            --output "${RUNNER_TEMP}/pncc-main-final/candidate-manifest.json" \
            --source-sha "${GITHUB_SHA}"
          python .pncc-dev/scripts/validate_candidate_manifest.py "${RUNNER_TEMP}/pncc-main-final/candidate-manifest.json"
          python .pncc-dev/scripts/validate_governed_candidate_manifest.py "${RUNNER_TEMP}/pncc-main-final/candidate-manifest.json"

      - name: Assemble governed provider artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pncc-bundle"
          cp "${RUNNER_TEMP}/pncc-main-final/${PNCC_ARTIFACT_FILENAME}" "${RUNNER_TEMP}/pncc-bundle/"
          cp "${RUNNER_TEMP}/pncc-main-final/candidate-manifest.json" "${RUNNER_TEMP}/pncc-bundle/"
          cp "${RUNNER_TEMP}/pncc-main-final/build-evidence.json" "${RUNNER_TEMP}/pncc-bundle/"
          git show HEAD:.pncc-dev/candidate-source.json > "${RUNNER_TEMP}/pncc-bundle/candidate-source.json"
          git show HEAD:build/windows-v7-candidate-recipe.json > "${RUNNER_TEMP}/pncc-bundle/windows-v7-candidate-recipe.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pncc-bundle'
          rows=[]
          for p in sorted(root.iterdir(), key=lambda x:x.name.encode('utf-8')):
              b=p.read_bytes()
              rows.append({'name':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          (root/'bundle-index.json').write_text(json.dumps({
              'schema_version':1,
              'bundle_id':'PNCC_GOVERNED_CANDIDATE_BUNDLE_V1',
              'candidate_version':os.environ['PNCC_CANDIDATE_VERSION'],
              'artifact_filename':os.environ['PNCC_ARTIFACT_FILENAME'],
              'source_sha':os.environ['GITHUB_SHA'],
              'files':rows,
              'runtime_qualification':'NOT_VERIFIED',
              'promotion_eligible':False
          },indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print('GOVERNED_CANDIDATE_BUNDLE=READY FILES='+str(len(rows)+1))
          PY

      - name: Upload governed candidate bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PNCC-CANDIDATE-${{ github.sha }}
          path: ${{ runner.temp }}/pncc-bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Generate provider-bound Stable runtime qualification request
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pncc-runtime-request"
          python .pncc-dev/scripts/generate_runtime_qualification_request.py \
            --candidate-manifest "${RUNNER_TEMP}/pncc-main-final/candidate-manifest.json" \
            --provider-artifact-id "${{ steps.upload.outputs.artifact-id }}" \
            --provider-artifact-digest "${{ steps.upload.outputs.artifact-digest }}" \
            --provider-build-run-id "${GITHUB_RUN_ID}" \
            --origin-work-unit-id "PIPE-WU-082" \
            --output "${RUNNER_TEMP}/pncc-runtime-request/runtime-qualification-request.json"

      - name: Upload Stable runtime qualification request
        id: upload-runtime-request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PNCC-RUNTIME-REQUEST-${{ github.sha }}
          path: ${{ runner.temp }}/pncc-runtime-request/runtime-qualification-request.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record provider artifact identity
        shell: bash
        run: |
          set -euo pipefail
          echo "GOVERNED_PROVIDER_ARTIFACT=PASS"
          echo "CANDIDATE_VERSION=${PNCC_CANDIDATE_VERSION}"
          echo "ARTIFACT_FILENAME=${PNCC_ARTIFACT_FILENAME}"
          echo "ARTIFACT_ID=${{ steps.upload.outputs.artifact-id }}"
          echo "ARTIFACT_DIGEST=${{ steps.upload.outputs.artifact-digest }}"
          echo "SOURCE_SHA=${GITHUB_SHA}"
          echo "RUNTIME=NOT_VERIFIED"
          echo "PROMOTION_ELIGIBLE=false"
          echo "RUNTIME_REQUEST=PASS"
          echo "RUNTIME_REQUEST_ARTIFACT_ID=${{ steps.upload-runtime-request.outputs.artifact-id }}"
          echo "RUNTIME_REQUEST_ARTIFACT_DIGEST=${{ steps.upload-runtime-request.outputs.artifact-digest }}"
          echo "RUNTIME_REQUEST_STATE=RUNTIME_PENDING"
          echo "RUNTIME_REQUEST_RUNTIME_AUTHORITY=false"
          echo "RUNTIME_REQUEST_PROMOTION_ELIGIBLE=false"
