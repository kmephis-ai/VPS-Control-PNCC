name: runtime-watchdog-bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-watchdog-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/runtime-agent/Invoke-PnccWatchdogBootstrapFromStageB.ps1'
          $bytes=[IO.File]::ReadAllBytes((Resolve-Path $path))
          if($bytes.Length -lt 3 -or $bytes[0]-ne 0xEF -or $bytes[1]-ne 0xBB -or $bytes[2]-ne 0xBF){throw 'UTF8 BOM required'}
          $tokens=$null;$errors=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if(@($errors).Count){$errors|ForEach-Object{Write-Error $_};exit 1}
          'RUNTIME_WATCHDOG_BOOTSTRAP_PARSE=PASS PS51=true'

      - name: Assert watchdog-only mutation boundary
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $text=Get-Content tools/runtime-agent/Invoke-PnccWatchdogBootstrapFromStageB.ps1 -Raw
          foreach($forbidden in @('RestartTunnel','Stop-Process','taskkill','Restart-Service','Stop-Service','Start-Service','-Action StartReserve','-Action StopReserve','SelectReserveRoute','netsh interface')){if($text -match [regex]::Escape($forbidden)){throw "forbidden tunnel/runtime mutation primitive: $forbidden"}}
          foreach($required in @('PNCC_RUNTIME_WORKSPACE_BOOTSTRAP_V2','candidate-provider-artifact','watchdog_bootstrap','PRIMARY_1081_TUNNEL_MUTATION=false','RESERVE_1080_MUTATION=false','Ensure-V7OfficialPuttyHostKeyTrust','-pwfile')){if(-not $text.Contains($required)){throw "required watchdog bootstrap token missing: $required"}}
          if($text -match 'VPS-Control-v7\.0\.0-rc14\.39\.zip'){throw 'stale RC14.39 artifact identity forbidden'}

      - name: Execute plan fixture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'watchdog-bootstrap-plan'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\runtime-agent\Invoke-PnccWatchdogBootstrapFromStageB.ps1 -Mode Plan -FixturePath .\.pncc-dev\tests\runtime-watchdog-bootstrap-ready.fixture.json -OutputDirectory $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          'RUNTIME_WATCHDOG_BOOTSTRAP_PLAN=PASS PS51=true'

      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain --untracked-files=all){git status --short;throw 'repository became dirty'}
