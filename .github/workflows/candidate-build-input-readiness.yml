name: candidate-build-input-readiness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-build-input-readiness:
    name: candidate-build-input-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Compile readiness evaluator and parse governed contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .pncc-dev/scripts/evaluate_candidate_build_input.py .pncc-dev/tests/test_candidate_build_input.py
          python - <<'PY'
          import json
          from pathlib import Path
          for raw in (
              '.pncc-dev/contracts/candidate-build-input-policy.json',
              '.pncc-dev/candidate-source.json',
              'build/windows-v7-candidate-recipe.json',
              '.pncc-dev/provenance/canonical-source-post-rc14.38.json',
          ):
              path=Path(raw)
              json.loads(path.read_text(encoding='utf-8-sig'))
              print(f'JSON_PARSE=PASS PATH={path}')
          PY

      - name: Run build-input readiness regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .pncc-dev/tests -p 'test_candidate_build_input.py' -v

      - name: Prove current repository build inputs are READY
        shell: bash
        run: |
          set -euo pipefail
          python .pncc-dev/scripts/evaluate_candidate_build_input.py --repository-root . --expect-state READY

      - name: Prove future builder guard accepts only exact READY inputs
        shell: bash
        run: |
          set -euo pipefail
          output="$(python .pncc-dev/scripts/evaluate_candidate_build_input.py --repository-root . --require-ready 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F 'CANDIDATE_BUILD_INPUT_STATE=READY'
          printf '%s\n' "$output" | grep -F 'CAN_BUILD=true'
          printf '%s\n' "$output" | grep -F 'RUNTIME_AUTHORITY=false'
          printf '%s\n' "$output" | grep -F 'PROMOTION_AUTHORITY=false'
          echo 'CANDIDATE_BUILD_GUARD=PASS STATE=READY CAN_BUILD=true RUNTIME_AUTHORITY=false PROMOTION_AUTHORITY=false'
