name: stable-credential-hostkey-v4
on:
  pull_request:
  workflow_dispatch:
jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 parse and fixture contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/runtime-agent/Test-PnccStableCredentialHostkeyV4.ps1'
          $raw=[IO.File]::ReadAllBytes($p)
          if($raw.Length-lt3 -or $raw[0]-ne0xEF -or $raw[1]-ne0xBB -or $raw[2]-ne0xBF){ throw 'UTF-8 BOM required' }
          [void][scriptblock]::Create([IO.File]::ReadAllText($p))
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $p -Mode Fixture -FixturePath '.pncc-dev/tests/stable-credential-hostkey-v4-ready.fixture.json' -OutputDirectory "$env:RUNNER_TEMP\pncc-wu072-v4"
          if($LASTEXITCODE-ne0){ throw "V4 fixture contract failed rc=$LASTEXITCODE" }
          $r=Get-Content "$env:RUNNER_TEMP\pncc-wu072-v4\stable-credential-hostkey-v4-result.json" -Raw|ConvertFrom-Json
          if($r.state-ne'CREDENTIAL_HOSTKEY_V4_CONTRACT_ADMITTED'){throw 'unexpected V4 state'}
          if([bool]$r.runtime_mutation -or [bool]$r.runtime_authority -or [bool]$r.promotion_eligible){throw 'forbidden authority/mutation flag'}
      - name: Static READ_ONLY boundary
        shell: powershell
        run: |
          $raw=Get-Content 'tools/runtime-agent/Test-PnccStableCredentialHostkeyV4.ps1' -Raw
          foreach($bad in @('Stop-Process','Start-Process','RestartTunnel','Remove-Item','Set-ItemProperty')){if($raw-match[regex]::Escape($bad)){throw "forbidden mutation primitive: $bad"}}
          foreach($required in @('canonical_dpapi_implementation','ConvertTo-SecureString','SecureStringToBSTR','ZeroFreeBSTR','Ensure-V7OfficialPuttyHostKeyTrust','Get-DpapiPassword','-pwfile')){if($raw-notmatch[regex]::Escape($required)){throw "required V4 evidence marker missing: $required"}}
      - name: Repo clean
        shell: powershell
        run: |
          if(git status --porcelain){throw 'repository dirty after V4 contract'}
