name: wave5-autonomous-continuation-human-by-exception-durable-session-resume-existing-authority-only

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin immutable WU-130 Provider Truth acquisition
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin pncc-provider-state
          git cat-file -e 0125bab6c05fd28cf4c50db81515f1ede880a207^{commit}
          git cat-file -e cd4f127c616968eb407b02a77cbcd95c15c776c2^{commit}
          test "$(git rev-parse cd4f127c616968eb407b02a77cbcd95c15c776c2^)" = "0125bab6c05fd28cf4c50db81515f1ede880a207"
          git show cd4f127c616968eb407b02a77cbcd95c15c776c2:.pncc-state/writer-lease-registry.json > /tmp/wu130-reg39.json
          test "$(git hash-object /tmp/wu130-reg39.json)" = "87e545c85a2e8641eba5e741adbad66fd305dab2"
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/wu130-reg39.json'))
          assert r['generation']==39
          e37=[e for e in r['entries'] if e['lease_id']=='b109e670-49f0-4ce2-9af6-27c6a01407e7']
          e38=[e for e in r['entries'] if e['lease_id']=='5f7f97d5-7fab-44c4-8dbb-375043a866b3']
          e39=[e for e in r['entries'] if e['lease_id']=='7435a7f5-9dcb-4c87-a803-62e0561f6153']
          assert len(e37)==len(e38)==len(e39)==1
          assert e37[0]['work_unit_id']=='PIPE-WU-129' and e37[0]['generation']==37 and e37[0]['state']=='ACTIVE'
          assert e37[0]['expires_at']=='2026-08-30T21:59:30Z'
          assert e38[0]['work_unit_id']=='PIPE-WU-129' and e38[0]['generation']==38 and e38[0]['state']=='RELEASED'
          x=e39[0]
          assert x['work_unit_id']=='PIPE-WU-130' and x['generation']==39 and x['state']=='ACTIVE'
          assert x['conflict_domain']=='wave5-autonomous-continuation-human-by-exception-durable-session-resume-existing-authority-only'
          assert x['holder']=='chatgpt-wave5-writer'
          assert x['base_sha']=='f6f942f40db14eac28b97fa79429f3ad49f1b9ae'
          assert x['branch']=='agent/PIPE-WU-130-human-by-exception-durable-session-resume-existing-authority-only'
          assert x['acquired_at']=='2026-08-31T04:05:45Z'
          assert x['heartbeat_at']=='2026-08-31T04:05:45Z'
          assert x['expires_at']=='2026-08-31T05:05:45Z'
          PY

      - name: Pin canonical definition anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-human-by-exception-steady-state-execution-wu129.json)" = "b644be019b821a7f2de30a05102f1ae8efb8d964"
          test "$(git hash-object .pncc-dev/contracts/durable-autonomous-continuation-session-resume-policy.json)" = "4305cd65c2ed7eaf67a6a6df24d3b4bb4d612446"
          test "$(git hash-object .pncc-dev/contracts/reusable-writer-lease-bounded-branch-authorized.json)" = "717e1f9081915f40fad2e0620c64245a650ca235"
          test "$(git hash-object .pncc-dev/contracts/writer-lease-claim-admission-policy.json)" = "bf83539899df5c5a4e660734e861653f1d4cc1ee"
          test "$(git hash-object .pncc-dev/scripts/validate_writer_lease_registry_topology.py)" = "aad1f221e28cd413408c676eb9ea9da48c4130f0"
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-control-loop-policy.json)" = "822bcd1833ff4843b6bd176337b3ef3b742275de"
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-execution-admission-policy.json)" = "406d78da6250c452bfc7706b57dc51a18ca48977"

      - name: Validate WU-130 policy contract
        run: |
          python3 .pncc-dev/scripts/evaluate_autonomous_continuation_human_by_exception_durable_session_resume.py --policy .pncc-dev/contracts/autonomous-continuation-human-by-exception-durable-session-resume-policy-wu130.json --self-check

      - name: Run WU-130 adversarial tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_autonomous_continuation_human_by_exception_durable_session_resume_wu130.py' -v

      - name: Validate governed frontier advancement on original PR only
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-130-human-by-exception-durable-session-resume-existing-authority-only'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORK_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "f6f942f40db14eac28b97fa79429f3ad49f1b9ae"
          git show "$BASE_SHA:.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json" > /tmp/wu130-predecessor.json
          test "$(git hash-object /tmp/wu130-predecessor.json)" = "f949f6c645ad922be6f7f1636e12705e6217bd1e"
          test "$(git hash-object .pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json)" = "806a1b12c5d9fc157c20979fd696d6080a238c74"
          python3 .pncc-dev/scripts/evaluate_governed_frontier_lifecycle.py --transition .pncc-dev/contracts/governed-frontier-transition-pipe-wu-130.json --predecessor /tmp/wu130-predecessor.json --successor .pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json --work-unit-id PIPE-WU-130 --base-sha "$BASE_SHA" --branch "$WORK_BRANCH"

      - name: Pin immutable WU-130 artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/contracts/autonomous-continuation-human-by-exception-durable-session-resume-policy-wu130.json)" = "c2691ffade539f09bf6e70012e4baa7b1ee034b2"
          test "$(git hash-object .pncc-dev/scripts/evaluate_autonomous_continuation_human_by_exception_durable_session_resume.py)" = "01a62d4d60ed915d8e1993027be1ac075b40fae0"
          test "$(git hash-object .pncc-dev/tests/test_autonomous_continuation_human_by_exception_durable_session_resume_wu130.py)" = "4b6da746fa097a1d653f3ce8977ecd8e895713fb"
          test "$(git hash-object .pncc-dev/contracts/governed-frontier-transition-pipe-wu-130.json)" = "213eaf383774815dee68331c6289b2ed63389723"

      - name: Enforce exact bounded WU-130 diff and ancestry
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-130-human-by-exception-durable-session-resume-existing-authority-only'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "f6f942f40db14eac28b97fa79429f3ad49f1b9ae"
          test "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" = "$BASE_SHA"
          FIRST_COMMIT="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA" | head -n 1)"
          test -n "$FIRST_COMMIT"
          test "$(git rev-parse "$FIRST_COMMIT^")" = "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual
          printf '%s\n' '.github/workflows/wave5-autonomous-continuation-human-by-exception-durable-session-resume-existing-authority-only.yml' '.pncc-dev/contracts/autonomous-continuation-human-by-exception-durable-session-resume-policy-wu130.json' '.pncc-dev/contracts/governed-frontier-transition-pipe-wu-130.json' '.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json' '.pncc-dev/scripts/evaluate_autonomous_continuation_human_by_exception_durable_session_resume.py' '.pncc-dev/tests/test_autonomous_continuation_human_by_exception_durable_session_resume_wu130.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -E '^(\.pncc-state/|src/windows-v7/|\.adwf-consumer/|tools/runtime-agent/|tools/release/)' /tmp/actual

      - name: Enforce read-only workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/wave5-autonomous-continuation-human-by-exception-durable-session-resume-existing-authority-only.yml')
          t=p.read_text().lower()
          forbidden=['contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write','git'+' push','gh'+' pr merge','gh'+' issue close','--method'+' post','--method'+' patch','--method'+' put','--method'+' delete']
          for token in forbidden: assert token not in t,token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
