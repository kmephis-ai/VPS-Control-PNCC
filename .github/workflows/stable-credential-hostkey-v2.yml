name: stable-credential-hostkey-v2

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  stable-credential-hostkey-v2:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: PS5.1 parse and BOM preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='tools/runtime-agent/Test-PnccStableCredentialHostkeyV2.ps1'
          $b=[IO.File]::ReadAllBytes((Resolve-Path $path))
          if($b.Length -lt 3 -or $b[0]-ne 0xEF -or $b[1]-ne 0xBB -or $b[2]-ne 0xBF){throw 'UTF8 BOM required'}
          $t=$null;$e=$null
          [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$t,[ref]$e)|Out-Null
          if(@($e).Count){$e|%{Write-Error $_};exit 1}
      - name: Assert READ_ONLY boundary
        shell: powershell
        run: |
          $x=Get-Content tools/runtime-agent/Test-PnccStableCredentialHostkeyV2.ps1 -Raw
          foreach($n in @('PNCC_STABLE_CREDENTIAL_HOSTKEY_V2','V7-DPAPI','-pwfile','Ensure-V7OfficialPuttyHostKeyTrust','hostkey_callsite_guard_before_dpapi_decrypt','runtime_mutation=$false','runtime_authority=$false','promotion_eligible=$false')){if(-not$x.Contains($n)){throw "missing marker: $n"}}
          foreach($n in @('Stop-Process','RestartTunnel','Remove-ItemProperty','reg.exe delete','-hostkey *')){if($x -match [regex]::Escape($n)){throw "forbidden mutation/bypass primitive: $n"}}
      - name: Execute fixture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $out=Join-Path $env:RUNNER_TEMP 'stable-credential-hostkey-v2'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\runtime-agent\Test-PnccStableCredentialHostkeyV2.ps1 -Mode Fixture -FixturePath .\.pncc-dev\tests\stable-credential-hostkey-v2-ready.fixture.json -OutputDirectory $out
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $r=Get-Content (Join-Path $out 'stable-credential-hostkey-v2-result.json') -Raw|ConvertFrom-Json
          if($r.state -ne 'CREDENTIAL_HOSTKEY_V2_CONTRACT_ADMITTED' -or [bool]$r.runtime_mutation -or [bool]$r.runtime_authority -or [bool]$r.promotion_eligible){throw 'fixture invariant failed'}
      - name: Assert repository clean
        shell: powershell
        run: |
          if(git status --porcelain --untracked-files=all){git status --short;throw 'repository became dirty'}
