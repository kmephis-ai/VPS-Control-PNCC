name: stable-primary-1081-mutation-authorization

on:
  pull_request:
    paths:
      - 'tools/runtime-agent/Test-PnccStablePrimary1081MutationAuthorization.ps1'
      - '.pncc-dev/tests/stable-primary-1081-mutation-authorization-ready.fixture.json'
      - '.github/workflows/stable-primary-1081-mutation-authorization.yml'

permissions:
  contents: read

jobs:
  stable-primary-1081-mutation-authorization:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: PowerShell 5.1 parse preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/runtime-agent/Test-PnccStablePrimary1081MutationAuthorization.ps1'
          $null=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$null,[ref]$null)
      - name: Assert mutation authorization safety contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='tools/runtime-agent/Test-PnccStablePrimary1081MutationAuthorization.ps1'
          $raw=Get-Content $p -Raw
          foreach($required in @('parentage_not_authority','pid_only_not_authority','broad_process_kill_forbidden','mutation_executed=$false','reserve_1080_mutation=$false','primary_1081_tunnel_mutation=$false')){if($raw -notlike ('*'+$required+'*')){throw "missing safety contract: $required"}}
          foreach($forbidden in @('Stop-Process','RestartTunnel','Start-Process')){if($raw -match [regex]::Escape($forbidden)){throw "forbidden runtime mutation primitive: $forbidden"}}
      - name: Execute admitted fixture under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mutation-authorization.json'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.\tools\runtime-agent\Test-PnccStablePrimary1081MutationAuthorization.ps1' -Mode Fixture -FixturePath '.\.pncc-dev\tests\stable-primary-1081-mutation-authorization-ready.fixture.json' -OutputPath $out
          if($LASTEXITCODE -ne 0){throw "fixture exit=$LASTEXITCODE"}
          $r=Get-Content $out -Raw|ConvertFrom-Json
          if($r.state -ne 'AUTHORIZATION_ADMITTED'){throw 'authorization not admitted'}
          if($r.mutation_executed -or $r.runtime_mutation -or $r.reserve_1080_mutation -or $r.primary_1081_tunnel_mutation){throw 'mutation boundary violated'}
          if($r.runtime_authority -or $r.promotion_eligible){throw 'authority boundary violated'}
      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain){throw 'repository dirty after fixture'}
