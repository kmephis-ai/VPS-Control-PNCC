name: stable-startup-consistency-regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-consistency-regression:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert Windows PowerShell 5.1 baseline
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($PSVersionTable.PSVersion.Major -ne 5){ throw "Windows PowerShell 5.x required; actual=$($PSVersionTable.PSVersion)" }
          Write-Host "WINDOWS_POWERSHELL_BASELINE=$($PSVersionTable.PSVersion)"

      - name: Parse canonical Windows package scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $files=Get-ChildItem -LiteralPath 'src\windows-v7' -Recurse -Filter '*.ps1' -File
          foreach($file in $files){
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){ throw "AST_FAIL $($file.FullName): $(($errors|ForEach-Object{$_.Message}) -join '; ')" }
          }
          Write-Host "PACKAGE_AST=PASS FILES=$(@($files).Count)"

      - name: Run startup consistency false-positive regression
        shell: powershell
        run: |
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File '.pncc-dev\tests\Test-V7ConsistencyStartupRegression.ps1'
          if($LASTEXITCODE -ne 0){ throw "startup consistency regression failed rc=$LASTEXITCODE" }

      - name: Verify corrected module SHA256 is sealed in package manifest
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $module='src\windows-v7\modules\V7-Consistency.ps1'
          $manifestPath='src\windows-v7\VPS-Control-v7-SHA256.txt'
          $hash=([string](Get-FileHash -LiteralPath $module -Algorithm SHA256).Hash).ToLowerInvariant()
          $manifest=Get-Content -LiteralPath $manifestPath -Raw
          $expectedLine="$hash  modules\V7-Consistency.ps1"
          if(-not $manifest.Contains($expectedLine)){throw "manifest does not seal corrected module SHA256=$hash"}
          Write-Host "WU080_WORKTREE_MODULE_SHA256=$hash"
          Write-Host 'PACKAGE_MANIFEST_CORRECTED_MODULE=PASS'

      - name: Emit canonical Git-blob identities
        shell: python
        run: |
          import hashlib, subprocess
          for label, path in (
              ('MODULE','src/windows-v7/modules/V7-Consistency.ps1'),
              ('MANIFEST','src/windows-v7/VPS-Control-v7-SHA256.txt'),
          ):
              blob=subprocess.check_output(['git','show',f'HEAD:{path}'])
              print(f'WU080_GIT_BLOB_{label}_SHA256={hashlib.sha256(blob).hexdigest()}')
              print(f'WU080_GIT_BLOB_{label}_BYTES={len(blob)}')

      - name: Assert physical startup remains private evidence only
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $policy=Get-Content -LiteralPath '.pncc-dev\contracts\patch-release-startup-acceptance-policy.json' -Raw | ConvertFrom-Json
          if([bool]$policy.github_ci_can_satisfy_physical_acceptance){throw 'GitHub CI cannot satisfy physical startup acceptance'}
          if([bool]$policy.runtime_mutation_allowed){throw 'Hosted regression must not allow runtime mutation'}
          if([bool]$policy.reserve_1080_mutation_allowed){throw '1080 mutation forbidden'}
          if([bool]$policy.primary_1081_mutation_allowed){throw '1081 mutation forbidden for startup acceptance'}
          if([bool]$policy.published_v7_0_0_asset_mutation_allowed){throw 'published v7.0.0 asset must remain immutable'}
          if([bool]$policy.published_v7_0_0_tag_retarget_allowed){throw 'published v7.0.0 tag must remain immutable'}
          Write-Host 'PHYSICAL_STARTUP_AUTHORITY=false'
          Write-Host 'RUNTIME_MUTATION=false'

      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain){throw 'workflow mutated repository'}
