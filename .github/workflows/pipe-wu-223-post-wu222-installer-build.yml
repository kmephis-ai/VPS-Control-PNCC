name: pipe-wu-223-post-wu222-installer-build

on:
  pull_request:
    branches: [main]
    paths:
      - '.pncc-dev/contracts/pipe-wu-223-post-wu222-installer-build.json'
      - '.github/workflows/pipe-wu-223-post-wu222-installer-build.yml'
  issues:
    types: [edited]

permissions:
  contents: read

jobs:
  validate-control-plane:
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify bounded control-plane diff
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='53f5584edd589529f7182c77d980aa6b1a1fd12c'
          if('${{ github.event.pull_request.base.sha }}' -ne $base){throw 'CONTROL_PLANE_BASE_MISMATCH'}
          $expected=@(
            '.github/workflows/pipe-wu-223-post-wu222-installer-build.yml',
            '.pncc-dev/contracts/pipe-wu-223-post-wu222-installer-build.json'
          ) | Sort-Object
          $actual=@(git diff --name-only "$base...HEAD" | Sort-Object)
          if(($actual -join "`n") -ne ($expected -join "`n")){throw "BOUNDED_DIFF_MISMATCH actual=$($actual -join ',')"}
          if(@($actual | Where-Object {$_ -match '^(src/|installer/|legacy/|tools/runtime-agent/)'}).Count){throw 'PRODUCT_RUNTIME_MUTATION_FORBIDDEN'}
      - name: Verify WU223 contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $c=Get-Content '.pncc-dev/contracts/pipe-wu-223-post-wu222-installer-build.json' -Raw | ConvertFrom-Json
          if($c.work_unit -ne 'PIPE-WU-223'){throw 'WORK_UNIT_MISMATCH'}
          if($c.authorized_source_main -ne '53f5584edd589529f7182c77d980aa6b1a1fd12c'){throw 'AUTHORIZED_SOURCE_MISMATCH'}
          if($c.installer_definition.git_blob -ne '611b4aa94a6091d669a291bf40c5f1079fc95ec6'){throw 'INSTALLER_BINDING_MISMATCH'}
          if($c.reconciled_manifest.git_blob -ne '895a321e4f3f2317836558938e6150cf454a23cf'){throw 'MANIFEST_BINDING_MISMATCH'}
          if($c.wu218_engine.git_blob -ne '9c5f991b6f215961aead21152a715ac242d833ff'){throw 'WU218_ENGINE_BINDING_MISMATCH'}
          if($c.immutable_v631.sha256 -ne '385e5178f10e79b0b234376e6a6671b64ce523a3971b2b4341ec94ce1efee11e'){throw 'V631_BINDING_MISMATCH'}
          if($c.compiler.sha256 -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'){throw 'COMPILER_BINDING_MISMATCH'}
          if([bool]$c.runtime_launch_allowed -or [bool]$c.primary_1081_launch_allowed){throw 'RUNTIME_AUTHORITY_FORBIDDEN'}
          if($c.reserve_1080_policy -ne 'OBSERVATION_ONLY'){throw 'RESERVE_POLICY_MISMATCH'}

  build-installer:
    if: github.event_name == 'issues' && github.event.issue.number == 492 && contains(github.event.issue.body, 'PNCC-WU223-INSTALLER-BUILD-EXECUTE')
    runs-on: windows-2025
    timeout-minutes: 20
    concurrency:
      group: pncc-wu223-one-installer
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Verify one-shot execution marker
        shell: pwsh
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          $ErrorActionPreference='Stop'
          $source='53f5584edd589529f7182c77d980aa6b1a1fd12c'
          $pattern='<!--\s*PNCC-WU223-INSTALLER-BUILD-EXECUTE\s+schema=1\s+expected_source='+[Regex]::Escape($source)+'\s*-->'
          if([Regex]::Matches($env:ISSUE_BODY,$pattern).Count -ne 1){throw 'EXECUTION_MARKER_INVALID'}
          if([Regex]::Matches($env:ISSUE_BODY,'PNCC-WU223-INSTALLER-BUILD-EXECUTE').Count -ne 1){throw 'EXECUTION_MARKER_AMBIGUOUS'}
          if($env:RUNNER_ENVIRONMENT -ne 'github-hosted'){throw 'GITHUB_HOSTED_REQUIRED'}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 53f5584edd589529f7182c77d980aa6b1a1fd12c
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact post-WU222 source lineage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='53f5584edd589529f7182c77d980aa6b1a1fd12c'
          if((git rev-parse HEAD).Trim() -ne $source){throw 'EXACT_SOURCE_MISMATCH'}
          $checks=@{
            'installer/windows/VPS-Control-PNCC.iss'='611b4aa94a6091d669a291bf40c5f1079fc95ec6'
            'src/windows-v7/VPS-Control-v7.cmd'='a1863caae0fd0ca3a9205b55f7474ba962d828bb'
            'src/windows-v7/VPS-Control-v7-launch.ps1'='036b5a1ffbb7d7ace85d4ecf9a5130bfd284cd54'
            'src/windows-v7/VPS-Control-v7-engine-upgrade.ps1'='9c5f991b6f215961aead21152a715ac242d833ff'
            'src/windows-v7/VPS-Control-v7-SHA256.txt'='895a321e4f3f2317836558938e6150cf454a23cf'
            'src/rollback-base/VPS-Control-v6.3.1.ps1'='fbcf80dac2d619c421b8a40b5612cd13d5da4a73'
          }
          foreach($p in $checks.Keys){
            if(-not(Test-Path $p -PathType Leaf)){throw "MISSING_$p"}
            $blob=(git hash-object $p).Trim()
            if($blob -ne $checks[$p]){throw "BLOB_MISMATCH path=$p actual=$blob expected=$($checks[$p])"}
          }
          $v='src/rollback-base/VPS-Control-v6.3.1.ps1'
          if((Get-Item $v).Length -ne 162507){throw 'V631_SIZE_MISMATCH'}
          if((Get-FileHash -Algorithm SHA256 $v).Hash.ToLowerInvariant() -ne '385e5178f10e79b0b234376e6a6671b64ce523a3971b2b4341ec94ce1efee11e'){throw 'V631_SHA256_MISMATCH'}
          $engineSha=(Get-FileHash -Algorithm SHA256 'src/windows-v7/VPS-Control-v7-engine-upgrade.ps1').Hash.ToLowerInvariant()
          if($engineSha -ne 'e636658b31683d89c28289ba785c6cdbf0142bdf371540df331cb36e8a065461'){throw 'ENGINE_SHA256_MISMATCH'}
          $manifest=Get-Content 'src/windows-v7/VPS-Control-v7-SHA256.txt'
          $checked=0
          foreach($line in $manifest){
            if(-not $line -or $line.TrimStart().StartsWith('#')){continue}
            if($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$'){throw "MANIFEST_LINE_INVALID $line"}
            $expected=$Matches[1].ToLowerInvariant();$rel=$Matches[2].Trim();$path=Join-Path 'src/windows-v7' $rel
            if(-not(Test-Path $path -PathType Leaf)){throw "MANIFEST_FILE_MISSING $rel"}
            $actual=(Get-FileHash -Algorithm SHA256 $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){throw "MANIFEST_SHA_MISMATCH path=$rel actual=$actual expected=$expected"}
            $checked++
          }
          if($checked -ne 31){throw "MANIFEST_ENTRY_COUNT_MISMATCH actual=$checked expected=31"}
      - name: Acquire pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $setup
          if((Get-Item $setup).Length -ne 14304168){throw 'COMPILER_SIZE_MISMATCH'}
          if((Get-FileHash -Algorithm SHA256 $setup).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'){throw 'COMPILER_SHA256_MISMATCH'}
          $dir=Join-Path $env:RUNNER_TEMP 'pncc-wu223-inno'
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR='+$dir)) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'COMPILER_INSTALL_FAILED'}
          "WU223_SETUP=$setup" | Add-Content $env:GITHUB_ENV
          "WU223_INNO=$dir" | Add-Content $env:GITHUB_ENV
          "WU223_ISCC=$(Join-Path $dir 'ISCC.exe')" | Add-Content $env:GITHUB_ENV
      - name: Build two byte-identical ephemeral candidates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pncc-wu223-repro'
          New-Item -ItemType Directory $root | Out-Null
          $hashes=@();$sizes=@();$paths=@()
          foreach($n in 'a','b'){
            $out=Join-Path $root $n
            New-Item -ItemType Directory $out | Out-Null
            $p=Start-Process $env:WU223_ISCC -ArgumentList @('/Q',('/O'+$out),'/FVPS-Control-PNCC-v7.0.2-setup',(Resolve-Path 'installer/windows/VPS-Control-PNCC.iss').Path) -Wait -PassThru
            if($p.ExitCode -ne 0){throw "BUILD_FAILED_$n"}
            $exe=Join-Path $out 'VPS-Control-PNCC-v7.0.2-setup.exe'
            if(-not(Test-Path $exe -PathType Leaf)){throw "OUTPUT_MISSING_$n"}
            $paths+=$exe
            $hashes+=(Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            $sizes+=(Get-Item $exe).Length
          }
          if($hashes[0] -ne $hashes[1]){throw "REPRODUCIBILITY_SHA256_MISMATCH $($hashes -join ',')"}
          if($sizes[0] -ne $sizes[1]){throw "REPRODUCIBILITY_SIZE_MISMATCH $($sizes -join ',')"}
          $final=Join-Path $env:RUNNER_TEMP 'VPS-Control-PNCC-v7.0.2-setup.exe'
          Copy-Item $paths[0] $final
          "WU223_EXE=$final" | Add-Content $env:GITHUB_ENV
          "WU223_SHA=$($hashes[0])" | Add-Content $env:GITHUB_ENV
          "WU223_SIZE=$($sizes[0])" | Add-Content $env:GITHUB_ENV
      - name: Cleanup compiler and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Remove-Item $env:WU223_INNO -Recurse -Force
          Remove-Item $env:WU223_SETUP -Force
          if(git status --porcelain){throw 'SOURCE_CHECKOUT_MUTATED'}
          @"
          ## PIPE-WU-223 exact post-WU222 installer
          - authorized source main: 53f5584edd589529f7182c77d980aa6b1a1fd12c
          - reconciled manifest Git blob: 895a321e4f3f2317836558938e6150cf454a23cf
          - WU218 engine Git blob: 9c5f991b6f215961aead21152a715ac242d833ff
          - immutable V6.3.1 SHA-256: 385e5178f10e79b0b234376e6a6671b64ce523a3971b2b4341ec94ce1efee11e
          - compiler: Inno Setup 7.1.0
          - compiler SHA-256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
          - output SHA-256: $env:WU223_SHA
          - output bytes: $env:WU223_SIZE
          - two candidates byte-identical: true
          - uploaded artifact count: 1
          - runtime launch: false
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload exactly one installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: VPS-Control-PNCC-v7.0.2-setup.exe
          path: ${{ env.WU223_EXE }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
