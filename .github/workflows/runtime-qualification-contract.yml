name: runtime-qualification-contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-qualification-contract:
    name: runtime-qualification-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Parse closed runtime qualification contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths=(
            '.pncc-dev/contracts/runtime-qualification-policy.json',
            '.pncc-dev/schemas/runtime-qualification-request.schema.json',
            '.pncc-dev/schemas/runtime-qualification-result.schema.json',
            '.pncc-dev/requests/runtime-qualification-rc14.39.json',
          )
          for raw in paths:
              p=Path(raw); json.loads(p.read_text(encoding='utf-8-sig')); print('JSON_PARSE=PASS PATH='+raw)
          for raw in ('.pncc-dev/scripts/evaluate_runtime_qualification.py','.pncc-dev/tests/test_runtime_qualification.py'):
              p=Path(raw); compile(p.read_text(encoding='utf-8-sig'),raw,'exec'); print('PY_COMPILE=PASS PATH='+raw)
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Run runtime qualification contract regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .pncc-dev/tests -p 'test_runtime_qualification.py' -v

      - name: Prove exact current candidate waits for trusted runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$(python .pncc-dev/scripts/evaluate_runtime_qualification.py --repository-root . --request .pncc-dev/requests/runtime-qualification-rc14.39.json)"
          echo "$out"
          grep -F 'RUNTIME_QUALIFICATION_STATE=WAITING_RUNTIME_EVIDENCE' <<<"$out"
          grep -F 'ARTIFACT_SHA256=8caad796469886b90d9928fba385fc4a4f0f3d60bcb6ee6b7cb98c4c2e4390b3' <<<"$out"
          grep -F 'RUNTIME_AUTHORITY=false PROMOTION_ELIGIBLE=false' <<<"$out"

      - name: Prove hosted CI cannot satisfy runtime verification requirement
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python .pncc-dev/scripts/evaluate_runtime_qualification.py --repository-root . --request .pncc-dev/requests/runtime-qualification-rc14.39.json --require-runtime-verified > require.out 2> require.err
          rc=$?
          set -e
          test "$rc" -eq 3
          grep -F 'RUNTIME_QUALIFICATION_STATE=WAITING_RUNTIME_EVIDENCE' require.out
          grep -F 'RUNTIME_QUALIFICATION_NOT_VERIFIED' require.err
          rm -f require.out require.err
          echo 'HOSTED_RUNTIME_AUTHORITY=DENIED PROMOTION_ELIGIBLE=false'
