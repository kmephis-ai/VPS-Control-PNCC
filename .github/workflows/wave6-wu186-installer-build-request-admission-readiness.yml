name: wave6-wu186-installer-build-request-admission-readiness

on:
  pull_request:
    paths:
      - '.pncc-dev/contracts/wave6-wu186-installer-build-request-admission-policy.json'
      - '.pncc-dev/schemas/wave6-wu186-installer-build-request.schema.json'
      - '.pncc-dev/scripts/evaluate_wave6_wu186_installer_build_request_admission.py'
      - '.pncc-dev/tests/test_wu186_installer_build_request_admission.py'
      - '.github/workflows/wave6-wu186-installer-build-request-admission-readiness.yml'

permissions:
  contents: read

jobs:
  admission-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact PR head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Compile evaluator
        run: python3 -m py_compile .pncc-dev/scripts/evaluate_wave6_wu186_installer_build_request_admission.py
      - name: Run current admission adversarial regression suite
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_wu186_installer_build_request_admission.py' -v
      - name: Prove execution authority remains absent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          policy=json.loads(pathlib.Path('.pncc-dev/contracts/wave6-wu186-installer-build-request-admission-policy.json').read_text(encoding='utf-8'))
          assert policy['execution_boundary']['persist_admitted_request'] is False
          assert policy['execution_boundary']['download_compiler'] is False
          assert policy['execution_boundary']['install_compiler'] is False
          assert policy['execution_boundary']['execute_compiler'] is False
          assert policy['execution_boundary']['build_installer_binary'] is False
          assert policy['execution_boundary']['upload_artifact'] is False
          assert not any(policy['authority'].values())
          print(policy['classification'])
          PY
      - name: Prove workflow itself is least-authority
        shell: bash
        run: |
          set -euo pipefail
          ! grep -n -E 'runs-on:[[:space:]]*self-hosted|contents:[[:space:]]*write|pull-requests:[[:space:]]*write|security-events:[[:space:]]*write' .github/workflows/wave6-wu186-installer-build-request-admission-readiness.yml
          ! grep -R -n -E 'Invoke-WebRequest|curl[[:space:]]|wget[[:space:]]|iscc(\.exe)?|innosetup-.*\.exe' .pncc-dev/contracts/wave6-wu186-installer-build-request-admission-policy.json .pncc-dev/scripts/evaluate_wave6_wu186_installer_build_request_admission.py
          test -z "$(git status --porcelain)"
