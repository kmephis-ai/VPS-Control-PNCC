name: post-stable-truth

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  post-stable-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Reconcile Stable completion and public docs
        run: python3 .pncc-dev/scripts/check_post_stable_truth.py
      - name: Assert workflow remains read-only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/post-stable-truth.yml').read_text(encoding='utf-8')
          assert sum(1 for line in s.splitlines() if line.strip() == 'contents: read') == 1
          forbidden=['contents:'+' write','git'+' push','git'+' tag','gh'+' release','releases:'+' write']
          for token in forbidden:
              assert token.lower() not in s.lower(), token
          PY
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
