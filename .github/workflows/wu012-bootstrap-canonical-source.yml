name: wu012-bootstrap-canonical-source

on:
  push:
    branches:
      - agent/PIPE-WU-012-canonical-source-admission-a1

permissions:
  contents: write

concurrency:
  group: wu012-bootstrap-canonical-source
  cancel-in-progress: false

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[wu012-bootstrap-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:legacy/v7-rc14.38-sanitized)" = "2a6c0027a195e91640ec2a6e38220a9fac372368"
          sha256sum -c <<'EOF'
          f2f4c613de1913120824a9403c229d43280fedd32728e85a05b8e1556f2a4594  .pncc-dev/bootstrap/VPS-Control-v7-vps-manager.ps1.patch
          2699c8aae4caa01bf375cb5721bbaccfe661643315546af2b96c9f57b338bb50  .pncc-dev/bootstrap/VPS-Control-v7-keenetic.ps1.patch
          EOF

      - name: Materialize canonical source from verified Git objects
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          src=Path('src/windows-v7'); src.mkdir(parents=True,exist_ok=True)
          tree=subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD','legacy/v7-rc14.38-sanitized'],text=True).splitlines()
          excluded={'PUBLIC_SANITATION.md','SANITIZED-SHA256.txt'}
          count=0
          for raw in tree:
              rel=raw.split('legacy/v7-rc14.38-sanitized/',1)[1]
              if rel in excluded: continue
              out=src/rel; out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(subprocess.check_output(['git','show',f'HEAD:{raw}']))
              count+=1
          if count != 31: raise SystemExit(f'expected 31 pre-manifest source files, got {count}')
          print('SOURCE_OBJECT_MATERIALIZATION=PASS FILES=31')

      - name: Apply exact credential remediations
        shell: bash
        run: |
          set -euo pipefail
          cd src/windows-v7
          git apply --check ../../.pncc-dev/bootstrap/VPS-Control-v7-vps-manager.ps1.patch
          git apply ../../.pncc-dev/bootstrap/VPS-Control-v7-vps-manager.ps1.patch
          git apply --check ../../.pncc-dev/bootstrap/VPS-Control-v7-keenetic.ps1.patch
          git apply ../../.pncc-dev/bootstrap/VPS-Control-v7-keenetic.ps1.patch
          vps_sha="$(sha256sum VPS-Control-v7-vps-manager.ps1 | awk '{print $1}')"
          keenetic_sha="$(sha256sum VPS-Control-v7-keenetic.ps1 | awk '{print $1}')"
          test "$vps_sha" = "bf9da87121e8a6134ae04b546b3a8f70be7ee5ce5ae7358063e8fa6d80d06a01"
          test "$keenetic_sha" = "ca51cdd1f5c7cb48cfe1f3561592f9fa4205ae2921cb36f924a5ffccd1d96ed3"
          echo "CREDENTIAL_REMEDIATION=PASS VPS_SHA=$vps_sha KEENETIC_SHA=$keenetic_sha"

      - name: Generate canonical package manifest and provenance
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json
          src=Path('src/windows-v7')
          manifest=src/'VPS-Control-v7-SHA256.txt'
          files=sorted(p for p in src.rglob('*') if p.is_file() and p != manifest)
          if len(files)!=31: raise SystemExit(f'expected 31 manifest entries, got {len(files)}')
          lines=['# VPS Control Center v7.0.0-rc14.38 post-RC14.38 credential-remediation source manifest']
          inventory=[]
          for p in files:
              b=p.read_bytes(); rel=p.relative_to(src).as_posix(); h=hashlib.sha256(b).hexdigest()
              lines.append(f"{h}  {rel.replace('/', chr(92))}")
              inventory.append({'path':rel,'bytes':len(b),'sha256':h})
          manifest.write_text('\n'.join(lines)+'\n',encoding='utf-8',newline='\n')
          mb=manifest.read_bytes(); inventory.append({'path':'VPS-Control-v7-SHA256.txt','bytes':len(mb),'sha256':hashlib.sha256(mb).hexdigest()})
          inventory=sorted(inventory,key=lambda x:x['path'])
          by={x['path']:x for x in inventory}
          prov={
            'schema_version':2,
            'provenance_id':'PNCC_CANONICAL_SOURCE_POST_RC14_38_ADMISSION_V2',
            'source_root':'src/windows-v7',
            'source_identity_semantic':'UNBUILT_POST_RC14_38_CREDENTIAL_REMEDIATION_BASELINE',
            'parent':{
              'private_rc14_38_sha256':'6d81137519a363ebf3d8503f33a344d8fdc75848d517cf732cb6d6d02394d727',
              'private_rc14_38_bytes':196487,
              'corrected_sanitized_rc14_38_sha256':'463c13217d909fb138417513409f02d91c735be4cc7eab25a5b3bfd3ebb6f489',
              'legacy_reference_git_tree':'2a6c0027a195e91640ec2a6e38220a9fac372368',
              'legacy_reference_authority':'BYTE_CACHE_REFERENCE_ONLY_NOT_SOURCE_AUTHORITY'
            },
            'baseline':{
              'embedded_version':'7.0.0-rc14.38',
              'requires_version_bump_before_build':True,
              'next_candidate_minimum_version':'7.0.0-rc14.39',
              'remediation_class':'PRODUCT_DEFECT_EXECUTABLE_PLAINTEXT_PW_IN_VPS_AND_KEENETIC_HELPERS',
              'remediated_files':['VPS-Control-v7-vps-manager.ps1','VPS-Control-v7-keenetic.ps1'],
              'remediated_file_sha256':{
                'VPS-Control-v7-vps-manager.ps1':by['VPS-Control-v7-vps-manager.ps1']['sha256'],
                'VPS-Control-v7-keenetic.ps1':by['VPS-Control-v7-keenetic.ps1']['sha256']
              },
              'preimport_evidence_zip_sha256':'e25ed4fff7aa2b44dc81e460155fc3fcb3af86d5f5782ecdcb7d78eeed631cc4'
            },
            'inventory':inventory,
            'safety':{'build_authority':False,'runtime_authority':False,'promotion_authority':False,'stable_done':False,'ci_is_runtime_truth':False}
          }
          out=Path('.pncc-dev/provenance/canonical-source-post-rc14.38.json'); out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(prov,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8',newline='\n')
          print(f'PROVENANCE_GENERATED=PASS FILES={len(inventory)}')

      - name: Fail-closed source precommit verification
        shell: bash
        run: |
          set -euo pipefail
          python .pncc-dev/scripts/check_putty_password_transport.py --self-test
          git add src/windows-v7 .pncc-dev/provenance/canonical-source-post-rc14.38.json
          python .pncc-dev/scripts/check_putty_password_transport.py --repository-root .
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re,ipaddress
          src=Path('src/windows-v7'); prov=json.loads(Path('.pncc-dev/provenance/canonical-source-post-rc14.38.json').read_text(encoding='utf-8'))
          actual=sorted(p for p in src.rglob('*') if p.is_file()); by={x['path']:x for x in prov['inventory']}
          if len(actual)!=32 or len(by)!=32: raise SystemExit('source/provenance file-count mismatch')
          for p in actual:
              rel=p.relative_to(src).as_posix(); b=p.read_bytes(); rec=by.get(rel)
              if not rec or rec['bytes']!=len(b) or rec['sha256']!=hashlib.sha256(b).hexdigest(): raise SystemExit('inventory mismatch: '+rel)
          private=[]
          for p in actual:
              b=p.read_bytes()
              if b.startswith(b'\xff\xfe'): text=b[2:].decode('utf-16le','ignore')
              else:
                  try:text=b.decode('utf-8-sig')
                  except UnicodeDecodeError:continue
              if re.search(r'(?i)AdminVPS|[A-Z]:\\(?:Users\\|YandexDisk)',text): private.append(p.as_posix())
              for m in re.finditer(r'(?<!\d)(?:\d{1,3}\.){3}\d{1,3}(?!\d)',text):
                  try: ip=ipaddress.ip_address(m.group())
                  except ValueError: continue
                  allowed=ip.is_loopback or m.group()=='0.0.0.0' or any(ip in ipaddress.ip_network(n) for n in ('192.0.2.0/24','198.51.100.0/24','203.0.113.0/24'))
                  if not allowed: private.append(p.as_posix())
          if private: raise SystemExit('private-instance findings: '+','.join(sorted(set(private))))
          print('CANONICAL_SOURCE_PRECOMMIT=PASS FILES=32 PRIVATE_FINDINGS=0 EXECUTABLE_PLAINTEXT_PW=0')
          PY

      - name: Commit ordinary canonical-source files only
        shell: bash
        run: |
          set -euo pipefail
          git reset
          git add src/windows-v7 .pncc-dev/provenance/canonical-source-post-rc14.38.json
          changed="$(git diff --cached --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(src/windows-v7/|\.pncc-dev/provenance/canonical-source-post-rc14\.38\.json$)' >/dev/null; then
            echo "$changed"
            echo 'BOOTSTRAP_SCOPE_VIOLATION=true'
            exit 1
          fi
          python .pncc-dev/scripts/check_putty_password_transport.py --repository-root .
          git diff --cached --check
          git config user.name 'PNCC GitHub Bootstrap'
          git config user.email 'pncc-bootstrap@users.noreply.github.com'
          git commit -m 'PIPE-WU-012: materialize canonical post-RC14.38 source [wu012-bootstrap-complete]'
          git push origin HEAD:agent/PIPE-WU-012-canonical-source-admission-a1
