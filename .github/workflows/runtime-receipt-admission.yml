name: runtime-receipt-admission

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate sanitized Runtime Truth receipt
        run: python3 .pncc-dev/scripts/validate_runtime_qualification_receipt.py
      - name: Assert attestation contains no private-runtime payloads
        shell: bash
        run: |
          set -euo pipefail
          test -f '.pncc-dev/attestations/runtime-qualification-rc14.39.json'
          ! grep -Eqi 'YandexDisk|Dropbox|LOCALAPPDATA|DESKTOP-|\\Users\\|putty_portable\.exe' .pncc-dev/attestations/runtime-qualification-rc14.39.json
      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
