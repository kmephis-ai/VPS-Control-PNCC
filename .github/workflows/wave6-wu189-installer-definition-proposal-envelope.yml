name: wave6-wu189-installer-definition-proposal-envelope

on:
  pull_request:
    paths:
      - '.pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope-policy.json'
      - '.pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope.schema.json'
      - '.pncc-dev/scripts/wu189_installer_definition_proposal_envelope.py'
      - '.pncc-dev/tests/test_wu189_installer_definition_proposal_envelope.py'
      - '.github/workflows/wave6-wu189-installer-definition-proposal-envelope.yml'

permissions:
  contents: read

jobs:
  proposal-envelope-readiness:
    if: github.event.pull_request.head.ref == 'agent/PIPE-WU-189-installer-definition-proposal-envelope-digest-readiness'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile pure evaluator
        run: python3 -m py_compile .pncc-dev/scripts/wu189_installer_definition_proposal_envelope.py
      - name: Run adversarial tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_wu189_installer_definition_proposal_envelope.py' -v
      - name: Validate contract JSON and authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy=json.loads(Path('.pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope-policy.json').read_text(encoding='utf-8'))
          schema=json.loads(Path('.pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope.schema.json').read_text(encoding='utf-8'))
          assert policy['static_validator_dependency']['work_unit_id'] == 'PIPE-WU-188'
          assert policy['static_validator_dependency']['single_source_of_truth'] is True
          assert policy['proposal_identity']['exact_bytes'] is True
          assert policy['proposal_identity']['newline_normalization'] is False
          assert policy['durable_state']['installer_definition_path'] is None
          assert policy['durable_state']['installer_definition_blob_sha'] is None
          assert policy['durable_state']['installer_definition_sha256'] is None
          assert policy['durable_state']['proposal_receipt_persisted'] is False
          assert all(value is False for value in policy['authority'].values())
          assert schema['additionalProperties'] is False
          for key in ('installer_definition_identity_bound','materialization_authorized','build_authorized'):
              assert schema['properties'][key]['const'] is False
          PY
      - name: Assert bounded five-file diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.event.pull_request.base.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/workflows/wave6-wu189-installer-definition-proposal-envelope.yml
          .pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope-policy.json
          .pncc-dev/contracts/wave6-wu189-installer-definition-proposal-envelope.schema.json
          .pncc-dev/scripts/wu189_installer_definition_proposal_envelope.py
          .pncc-dev/tests/test_wu189_installer_definition_proposal_envelope.py
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual
      - name: Assert least-authority boundary
        shell: bash
        run: |
          set -euo pipefail
          ! git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -E '(^|/)src/|runtime-agent|\.iss$|\.exe$'
          ! grep -nE 'runs-on:[[:space:]]*self-hosted|contents:[[:space:]]*write|pull-requests:[[:space:]]*write|issues:[[:space:]]*write' .github/workflows/wave6-wu189-installer-definition-proposal-envelope.yml
          test "$(find .pncc-dev -type f \( -name '*.iss' -o -name '*.exe' \) -print | wc -l)" -eq 0
          test "$(find .pncc-dev -type f -iname '*wu189*receipt*.json' -print | wc -l)" -eq 0
      - name: Assert repository clean
        run: test -z "$(git status --porcelain)"
