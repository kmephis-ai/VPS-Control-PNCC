name: stable-release-tag-promotion-v701-boundary
on:
  pull_request:
    branches: [main]
    paths:
      - '.pncc-dev/attestations/stable-release-tag-promotion-v7.0.1.json'
      - '.pncc-dev/attestations/stable-release-tag-publication-v7.0.1.json'
      - '.pncc-dev/scripts/evaluate_stable_release_tag_promotion_v701.py'
      - '.pncc-dev/tests/test_v701_release_tag_promotion_boundary.py'
      - '.github/workflows/stable-release-tag-promotion.yml'
      - '.github/workflows/stable-release-tag-promotion-v701-boundary.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  exact-stable-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate repository Stable truth
        run: |
          python3 .pncc-dev/scripts/evaluate_stable_release_tag_promotion_v701.py
          python3 .pncc-dev/tests/test_v701_release_tag_promotion_boundary.py
      - name: Verify live GitHub tag release and asset
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ['REPOSITORY']; token=os.environ.get('GH_TOKEN','')
          h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'pncc-v701-stable-readback'}
          if token:h['Authorization']='Bearer '+token
          def get(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers=h),timeout=30) as r:return json.load(r)
          tag=get(f'https://api.github.com/repos/{repo}/git/ref/tags/v7.0.1')
          assert tag['object']['type']=='commit'
          assert tag['object']['sha']=='41e8c9c8bed2cc37423c33750d0748c49ff941b7'
          rel=get(f'https://api.github.com/repos/{repo}/releases/tags/v7.0.1')
          assert rel['id']==379032537 and rel['name']=='VPS Control PNCC v7.0.1'
          assert rel['draft'] is False and rel['prerelease'] is False
          assert rel['target_commitish']=='41e8c9c8bed2cc37423c33750d0748c49ff941b7'
          assets=[a for a in rel['assets'] if a['name']=='VPS-Control-v7.0.1.zip']
          assert len(assets)==1
          a=assets[0]
          assert a['id']==535416506 and a['size']==701893
          assert a['digest']=='sha256:22b843330516e481c467fe5cbe6d1d4c6758510c71bd2c46ebeec337f403ae72'
          print('LIVE_V701_STABLE_PUBLICATION=PASS')
          PY
      - name: Assert PR cannot mutate product source
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^src/windows-v7/'; then exit 1; fi
          echo PRODUCT_SOURCE_MUTATION=false
      - name: Assert no private evidence tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Eq '(^|/)(private-evidence\.zip|PNCC-WU087\.log|wu087-owner-run-result\.json|PNCC-WU090-PUBLISH\.log)$'; then exit 1; fi
          echo PRIVATE_EVIDENCE_TRACKED=false
