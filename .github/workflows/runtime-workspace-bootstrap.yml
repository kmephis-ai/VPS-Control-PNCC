name: runtime-workspace-bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-workspace-bootstrap:
    name: runtime-workspace-bootstrap
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $paths=@('tools/runtime-agent/Initialize-PnccRuntimeQualificationWorkspace.ps1','tools/runtime-agent/Invoke-PnccRuntimeQualificationAgent.ps1')
          foreach($path in $paths){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if(@($errors).Count -ne 0){ $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            $b=[IO.File]::ReadAllBytes((Resolve-Path $path))
            if($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF){ throw "UTF8 BOM missing: $path" }
          }
          if(git status --porcelain --untracked-files=all){ throw 'parse preflight dirtied repository' }
          'RUNTIME_WORKSPACE_BOOTSTRAP_PARSE=PASS PS51=true'

      - name: Acquire pinned Stable request and exact governed candidate
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pncc-runtime-bootstrap'
          & ./tools/runtime-agent/Initialize-PnccRuntimeQualificationWorkspace.ps1 `
            -OutputRoot $root `
            -Mode Provider `
            -RequestProviderArtifactId 9692080862 `
            -RequestProviderBuildRunId 33186877990 `
            -ExpectedRequestArtifactName 'PNCC-V7.0.0-RUNTIME-REQUEST-56f1e3798be0f5f034860adc04b609d0a07c2fc3' `
            -ExpectedRequestProviderDigest 'sha256:a56c89028ba7a234fee78d2f27ce24e898d4abeb4f60eb4afd5410d70067a793' `
            -ExpectedRequestSourceSha '56f1e3798be0f5f034860adc04b609d0a07c2fc3'
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $workspace=Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1
          if($null -eq $workspace){ throw 'workspace was not created' }
          $manifest=Get-Content (Join-Path $workspace.FullName 'workspace-manifest.json') -Raw | ConvertFrom-Json
          if([int]$manifest.schema_version -ne 2){ throw 'workspace manifest schema mismatch' }
          if($manifest.request_provider.artifact_id -ne 9692080862){ throw 'request provider artifact id mismatch' }
          if($manifest.request_provider.request_id -ne 'PNCC-RQ-V7.0.0-56F1E3798BE0'){ throw 'request id mismatch' }
          if($manifest.candidate.candidate_id -ne 'PNCC-V7.0.0-56F1E3798BE0'){ throw 'candidate id mismatch' }
          if($manifest.candidate.source_sha -ne '56f1e3798be0f5f034860adc04b609d0a07c2fc3'){ throw 'source SHA mismatch' }
          if($manifest.candidate.provider_artifact_id -ne 9692080233){ throw 'candidate provider artifact id mismatch' }
          if($manifest.candidate.artifact_sha256 -ne '1407f82b15ea2b70ba56b7406bb8dd0d9097c459b630d016d6a7b5f10a49e599'){ throw 'artifact SHA mismatch' }
          if([long]$manifest.candidate.artifact_size_bytes -ne 700897){ throw 'artifact size mismatch' }
          if($manifest.boundaries.runtime_mutation_permitted){ throw 'bootstrap cannot permit runtime mutation' }
          if($manifest.boundaries.runtime_authority){ throw 'bootstrap cannot grant runtime authority' }
          if($manifest.boundaries.promotion_eligible){ throw 'bootstrap cannot grant promotion eligibility' }
          $plan=Get-Content (Join-Path $workspace.FullName 'agent-dry-run/execution-plan.json') -Raw | ConvertFrom-Json
          if($plan.request_id -ne 'PNCC-RQ-V7.0.0-56F1E3798BE0'){ throw 'agent request id drift' }
          if($plan.candidate_id -ne 'PNCC-V7.0.0-56F1E3798BE0'){ throw 'agent candidate id drift' }
          if([long]$plan.provider_artifact_id -ne 9692080233){ throw 'agent provider artifact binding drift' }
          'RUNTIME_WORKSPACE_BOOTSTRAP=PASS AUTHORITY_CHAIN=REQUEST_PROVIDER_TO_CANDIDATE_PROVIDER REQUEST_ARTIFACT=9692080862 CANDIDATE_ARTIFACT=9692080233 RUNTIME_MUTATION=false'

      - name: Reject request-provider digest substitution
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Continue'
          $root=Join-Path $env:RUNNER_TEMP 'pncc-runtime-bootstrap-negative'
          & ./tools/runtime-agent/Initialize-PnccRuntimeQualificationWorkspace.ps1 `
            -OutputRoot $root `
            -Mode Provider `
            -RequestProviderArtifactId 9692080862 `
            -RequestProviderBuildRunId 33186877990 `
            -ExpectedRequestArtifactName 'PNCC-V7.0.0-RUNTIME-REQUEST-56f1e3798be0f5f034860adc04b609d0a07c2fc3' `
            -ExpectedRequestProviderDigest ('sha256:' + ('f' * 64)) `
            -ExpectedRequestSourceSha '56f1e3798be0f5f034860adc04b609d0a07c2fc3'
          $negativeRc=$LASTEXITCODE
          if($negativeRc -eq 0){ throw 'request provider digest substitution was accepted' }
          $global:LASTEXITCODE=0
          "REQUEST_PROVIDER_DIGEST_SUBSTITUTION=REJECTED RC=$negativeRc"

      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain --untracked-files=all){ git status --short; throw 'repository became dirty' }
          'OWNER_BOOTSTRAP_HOSTED_PROOF=PASS CI_VERIFIED_NOT_RUNTIME_VERIFIED=true'
