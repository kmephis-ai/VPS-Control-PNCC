name: runtime-workspace-bootstrap

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  runtime-workspace-bootstrap:
    name: runtime-workspace-bootstrap
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: PowerShell 5.1 parse and BOM preflight
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $paths=@('tools/runtime-agent/Initialize-PnccRuntimeQualificationWorkspace.ps1','tools/runtime-agent/Invoke-PnccRuntimeQualificationAgent.ps1')
          foreach($path in $paths){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors) | Out-Null
            if(@($errors).Count -ne 0){ $errors | ForEach-Object { Write-Error $_ }; exit 1 }
            $b=[IO.File]::ReadAllBytes((Resolve-Path $path))
            if($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF){ throw "UTF8 BOM missing: $path" }
          }
          if(git status --porcelain --untracked-files=all){ throw 'parse preflight dirtied repository' }
          'RUNTIME_WORKSPACE_BOOTSTRAP_PARSE=PASS PS51=true'

      - name: Acquire exact governed provider artifact and build isolated workspace
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'pncc-runtime-bootstrap'
          & ./tools/runtime-agent/Initialize-PnccRuntimeQualificationWorkspace.ps1 -OutputRoot $root -Mode Provider
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $workspace=Get-ChildItem -LiteralPath $root -Directory | Select-Object -First 1
          if($null -eq $workspace){ throw 'workspace was not created' }
          $manifest=Get-Content (Join-Path $workspace.FullName 'workspace-manifest.json') -Raw | ConvertFrom-Json
          if($manifest.candidate.source_sha -ne '90c9e8698c6468d576aecbc60d940be9d5c6baab'){ throw 'source SHA mismatch' }
          if($manifest.candidate.artifact_sha256 -ne '8caad796469886b90d9928fba385fc4a4f0f3d60bcb6ee6b7cb98c4c2e4390b3'){ throw 'artifact SHA mismatch' }
          if([long]$manifest.candidate.artifact_size_bytes -ne 700961){ throw 'artifact size mismatch' }
          if($manifest.boundaries.runtime_mutation_permitted){ throw 'bootstrap cannot permit runtime mutation' }
          if($manifest.boundaries.runtime_authority){ throw 'bootstrap cannot grant runtime authority' }
          if($manifest.boundaries.promotion_eligible){ throw 'bootstrap cannot grant promotion eligibility' }
          if(-not (Test-Path (Join-Path $workspace.FullName 'agent-dry-run/execution-plan.json'))){ throw 'agent dry-run plan missing' }
          'RUNTIME_WORKSPACE_BOOTSTRAP=PASS PROVIDER_ARTIFACT=9661221985 INNER_SHA256=8caad796469886b90d9928fba385fc4a4f0f3d60bcb6ee6b7cb98c4c2e4390b3 RUNTIME_MUTATION=false'

      - name: Assert repository remains clean
        shell: powershell
        run: |
          if(git status --porcelain --untracked-files=all){ git status --short; throw 'repository became dirty' }
          'OWNER_BOOTSTRAP_HOSTED_PROOF=PASS CI_VERIFIED_NOT_RUNTIME_VERIFIED=true'
