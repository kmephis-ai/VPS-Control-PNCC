name: wave5-provider-work-unit-selection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  provider-work-unit-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PNCC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run adversarial selector and continuation tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .pncc-dev/tests -p 'test_provider_work_unit_selector.py' -v
          python3 -m unittest discover -s .pncc-dev/tests -p 'test_provider_truth_continuation_wu106.py' -v

      - name: Assert immutable selector planner and reusable authority anchors
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/scripts/select_provider_work_unit.py)" = "8045a97d5344f058064690cb265b30f88973e2b8"
          test "$(git hash-object .pncc-dev/scripts/plan_governed_work_unit_materialization.py)" = "c561b34dbf3fb7cfefd1a2a9780aba6e857ec78c"
          test "$(git hash-object .pncc-dev/contracts/governed-work-unit-materialization-policy.json)" = "8b6b6d9116b96a8f4746c22906a522589a9ae6e0"
          test "$(git hash-object .pncc-dev/contracts/reusable-canonical-work-unit-materialization-authorized.json)" = "39db0554b86932b1beb4bb7250d040c06f9371ea"
          test "$(git hash-object .pncc-dev/contracts/reusable-writer-lease-bounded-branch-authorized.json)" = "717e1f9081915f40fad2e0620c64245a650ca235"
          test "$(git hash-object .pncc-dev/contracts/reusable-autonomous-merge-close-authorized.json)" = "baa503d63eaa437545ddcf0a045cf864d1ef36e6"
          test "$(git hash-object .pncc-dev/schemas/work-unit.schema.json)" = "a6b23c5695262192175216e6293d832f8e835851"

      - name: Read fresh GitHub provider truth through continuation integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .pncc-dev/scripts/evaluate_provider_truth_continuation.py \
            --repository "${{ github.repository }}" \
            --default-branch main \
            --live-github \
            --output "$RUNNER_TEMP/provider-truth-continuation.json"
          cat "$RUNNER_TEMP/provider-truth-continuation.json"

      - name: Assert continuation result remains read only and WU-106 is exact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/provider-truth-continuation.json" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          assert d['schema_version'] == 1
          assert d['role'] == 'PROVIDER_TRUTH_CONTINUATION_DECISION'
          assert d['decision'] in {
              'CONTINUE_SELECTED_WORK_UNIT',
              'PLAN_MATERIALIZATION',
              'WAITING_RUNTIME',
              'NO_FRONTIER',
              'BLOCKED',
          }
          for key in (
              'provider_mutation_performed',
              'issue_mutation_performed',
              'writer_lease_mutation_performed',
              'merge_performed',
              'runtime_action_performed',
          ):
              assert d[key] is False, key
          assert d['selector_guard_state'] in {'PASS', 'PROVEN_RECONCILED_PIN_DRIFT', None}
          if os.environ.get('EVENT_NAME') == 'pull_request' and os.environ.get('HEAD_REF') == 'agent/PIPE-WU-106-provider-truth-continuation-integration':
              assert d['decision'] == 'CONTINUE_SELECTED_WORK_UNIT', d
              assert d['selector_guard_state'] == 'PROVEN_RECONCILED_PIN_DRIFT'
              selected=d['selected']
              assert selected['issue'] == 259
              assert selected['work_unit_id'] == 'PIPE-WU-106'
              assert selected['classification'] == 'EXECUTABLE_READ_ONLY_SELECTION'
              assert selected['base_sha'] == 'f0040ac29aff587e43b227f820131b107424d72e'
              assert selected['runtime_required'] is False
              assert d['materialization_plan'] is None
          PY

      - name: Assert exact PIPE-WU-106 bounded diff
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/PIPE-WU-106-provider-truth-continuation-integration'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$BASE_SHA" = "f0040ac29aff587e43b227f820131b107424d72e"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sort > /tmp/actual
          printf '%s\n' \
            '.github/workflows/wave5-provider-work-unit-selection.yml' \
            '.pncc-dev/contracts/governed-frontier-transition-pipe-wu-106.json' \
            '.pncc-dev/contracts/provider-truth-continuation-policy.json' \
            '.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json' \
            '.pncc-dev/scripts/evaluate_provider_truth_continuation.py' \
            '.pncc-dev/tests/test_provider_truth_continuation_wu106.py' \
            '.pncc-dev/tests/test_provider_work_unit_selector.py' | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual
          ! grep -E '^(\.pncc-state/|src/windows-v7/|\.adwf-consumer/|tools/runtime-agent/)' /tmp/actual

      - name: Assert workflow exposes read-only provider permissions only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/wave5-provider-work-unit-selection.yml').read_text(encoding='utf-8')
          stripped=[line.strip() for line in s.splitlines()]
          assert stripped.count('contents: read') == 1
          assert stripped.count('issues: read') == 1
          forbidden=[
              'contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write',
              'git'+' push','git'+' tag','gh'+' release','gh'+' pr merge','gh'+' issue close',
              '--method'+' POST','--method'+' PATCH','--method'+' PUT','--method'+' DELETE',
              'curl -X '+'POST','curl -X '+'PATCH','curl -X '+'PUT','curl -X '+'DELETE'
          ]
          for token in forbidden:
              assert token.lower() not in s.lower(), token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
