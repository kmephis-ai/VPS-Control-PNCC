name: wave5-provider-work-unit-selection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  provider-work-unit-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PNCC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run adversarial selector and orchestration tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_provider_work_unit_selector.py' -v

      - name: Assert selector is bound to current Stable v7.0.1 proof truth
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .pncc-dev/scripts/select_provider_work_unit.py)" = "8045a97d5344f058064690cb265b30f88973e2b8"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.pncc-dev/scripts/select_provider_work_unit.py').read_text(encoding='utf-8')
          assert 'stable-v7.0.1-completion.json' in s
          assert '22b843330516e481c467fe5cbe6d1d4c6758510c71bd2c46ebeec337f403ae72' in s
          assert 'stable-v7.0.0-completion.json' not in s
          assert '1407f82b15ea2b70ba56b7406bb8dd0d9097c459b630d016d6a7b5f10a49e599' not in s
          assert 'NONE_BINDING_IS_PROOF_ONLY' in s
          for disposition in ('EXECUTABLE', 'WAITING_RUNTIME', 'BLOCKED', 'NO_WORK'):
              assert disposition in s
          PY

      - name: Read fresh GitHub provider truth or prove governed selector transition block
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/provider-work-unit-selection.json" <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          out=Path(sys.argv[1])
          root=Path('.')
          frontier=json.loads((root/'.pncc-dev/contracts/wave5-next-governed-work-unit-frontier.json').read_text(encoding='utf-8'))
          readiness=json.loads((root/'.adwf-consumer/wave5-readiness.json').read_text(encoding='utf-8'))
          spec=importlib.util.spec_from_file_location('pncc_provider_selector', root/'.pncc-dev/scripts/select_provider_work_unit.py')
          selector=importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(selector)
          transitional=(
              frontier.get('state') == 'ACTIVE'
              and frontier.get('frontier_id') == 'PROVIDER_TRUTH_PLANNER_SELECTOR_CONTINUATION_INTEGRATION'
              and readiness.get('framework', {}).get('source_sha') != selector.EXPECTED_ADWF_SHA
          )
          if transitional:
              try:
                  selector.validate_readiness_guard(root)
              except selector.SelectionError as exc:
                  assert str(exc) == 'WAVE5_ADWF_PIN_DRIFT', str(exc)
              else:
                  raise AssertionError('expected selector pin drift during governed transition')
              result={
                  'schema_version': 2,
                  'state': 'READ_ONLY_PROVIDER_TRUTH_SELECTION_BLOCKED_BY_GOVERNED_FRONTIER',
                  'decision': 'NO_EXECUTABLE_WORK_UNIT',
                  'orchestration_disposition': 'BLOCKED',
                  'selected': None,
                  'mutation_authority': 'NONE_BINDING_IS_PROOF_ONLY',
                  'provider_mutation_performed': False,
                  'writer_lease_acquired': False,
                  'runtime_action_performed': False,
                  'promotion_or_release_action_performed': False,
                  'next_boundary': 'PROVIDER_TRUTH_PLANNER_SELECTOR_CONTINUATION_INTEGRATION',
                  'block_reason': 'WAVE5_ADWF_PIN_DRIFT',
              }
              out.write_text(json.dumps(result, sort_keys=True, indent=2)+'\n', encoding='utf-8')
          else:
              subprocess.run([
                  sys.executable,
                  '.pncc-dev/scripts/select_provider_work_unit.py',
                  '--repository', os.environ['GITHUB_REPOSITORY'],
                  '--default-branch', 'main',
                  '--live-github',
                  '--output', str(out),
              ], check=True)
          PY
          cat "$RUNNER_TEMP/provider-work-unit-selection.json"

      - name: Assert live orchestration result remains default-deny
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/provider-work-unit-selection.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          assert d['schema_version'] == 2
          assert d['mutation_authority'] == 'NONE_BINDING_IS_PROOF_ONLY'
          assert d['provider_mutation_performed'] is False
          assert d['writer_lease_acquired'] is False
          assert d['runtime_action_performed'] is False
          assert d['promotion_or_release_action_performed'] is False
          if d['state'] == 'READ_ONLY_PROVIDER_TRUTH_SELECTION_BLOCKED_BY_GOVERNED_FRONTIER':
              assert d['decision'] == 'NO_EXECUTABLE_WORK_UNIT'
              assert d['orchestration_disposition'] == 'BLOCKED'
              assert d['selected'] is None
              assert d['block_reason'] == 'WAVE5_ADWF_PIN_DRIFT'
              assert d['next_boundary'] == 'PROVIDER_TRUTH_PLANNER_SELECTOR_CONTINUATION_INTEGRATION'
          else:
              assert d['state'] == 'READ_ONLY_PROVIDER_TRUTH_SELECTION_PASS'
              assert d['decision'] in {'SELECTED', 'NO_EXECUTABLE_WORK_UNIT'}
              assert d['orchestration_disposition'] in {'EXECUTABLE', 'WAITING_RUNTIME', 'BLOCKED', 'NO_WORK'}
              if d['orchestration_disposition'] == 'EXECUTABLE':
                  assert d['decision'] == 'SELECTED'
                  assert d['selected']['classification'] == 'EXECUTABLE_READ_ONLY_SELECTION'
                  assert d['selected']['runtime_required'] is False
                  assert d['next_boundary'] == 'DESIGN_DEFAULT_DENY_WRITER_LEASE_CLAIM_AUTHORITY'
          PY

      - name: Assert workflow exposes read-only provider permissions only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/wave5-provider-work-unit-selection.yml').read_text(encoding='utf-8')
          stripped=[line.strip() for line in s.splitlines()]
          assert stripped.count('contents: read') == 1
          assert stripped.count('issues: read') == 1
          forbidden=[
              'contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write',
              'git'+' push','git'+' tag','gh'+' release','gh'+' pr merge','gh'+' issue close',
              '--method'+' POST','--method'+' PATCH','--method'+' PUT','--method'+' DELETE',
              'curl -X '+'POST','curl -X '+'PATCH','curl -X '+'PUT','curl -X '+'DELETE'
          ]
          for token in forbidden:
              assert token.lower() not in s.lower(), token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
