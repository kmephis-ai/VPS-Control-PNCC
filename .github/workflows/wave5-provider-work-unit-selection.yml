name: wave5-provider-work-unit-selection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  provider-work-unit-selection:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PNCC revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Run adversarial selector tests
        run: python3 -m unittest discover -s .pncc-dev/tests -p 'test_provider_work_unit_selector.py' -v

      - name: Read fresh GitHub provider truth and select without mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .pncc-dev/scripts/select_provider_work_unit.py \
            --repository "${{ github.repository }}" \
            --default-branch main \
            --live-github \
            --output "$RUNNER_TEMP/provider-work-unit-selection.json"
          cat "$RUNNER_TEMP/provider-work-unit-selection.json"

      - name: Assert selector result remains default-deny
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/provider-work-unit-selection.json" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          assert d['state'] == 'READ_ONLY_PROVIDER_TRUTH_SELECTION_PASS'
          assert d['decision'] in {'SELECTED', 'NO_EXECUTABLE_WORK_UNIT'}
          assert d['mutation_authority'] == 'NONE_BINDING_IS_PROOF_ONLY'
          assert d['provider_mutation_performed'] is False
          assert d['writer_lease_acquired'] is False
          assert d['runtime_action_performed'] is False
          assert d['promotion_or_release_action_performed'] is False
          if d['decision'] == 'SELECTED':
              assert d['selected']['classification'] == 'EXECUTABLE_READ_ONLY_SELECTION'
              assert d['selected']['runtime_required'] is False
          PY

      - name: Assert workflow exposes read-only provider permissions only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/wave5-provider-work-unit-selection.yml').read_text(encoding='utf-8')
          stripped=[line.strip() for line in s.splitlines()]
          assert stripped.count('contents: read') == 1
          assert stripped.count('issues: read') == 1
          forbidden=['contents:'+' write','issues:'+' write','pull-requests:'+' write','actions:'+' write','git'+' push','git'+' tag','gh'+' release','--method'+' POST','--method'+' PATCH','--method'+' DELETE']
          for token in forbidden:
              assert token.lower() not in s.lower(), token
          PY

      - name: Assert repository remains clean
        run: test -z "$(git status --porcelain)"
